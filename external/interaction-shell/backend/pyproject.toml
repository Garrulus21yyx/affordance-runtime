[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "affordance-interaction-shell"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ag-ui-protocol>=0.1.10,<0.2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
model = ["pydantic-ai>=2,<3"]
deployment = [
  "browsergym-miniwob==0.14.3",
  "httpx>=0.28,<1",
  "Pillow>=11,<13",
  "playwright==1.44.0",
  "pydantic-ai>=2,<3",
  "pydantic-ai-harness>=0.25,<0.26",
  "python-dotenv>=1,<2",
  "websockets>=14,<17",
]
test = [
  "httpx>=0.28,<1",
  "hypothesis>=6.130,<7",
  "pyright>=1.1.400,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["interaction_shell"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests/backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
include = ["interaction_shell"]
typeCheckingMode = "basic"
reportMissingImports = false

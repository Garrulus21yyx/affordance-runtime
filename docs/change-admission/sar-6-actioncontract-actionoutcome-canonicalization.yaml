goal:
  summary: >
    Canonicalize action execution identity and post-action outcome so downstream
    progress code reads one ActionOutcome instead of separately interpreting
    receipt, post-observation, verification, route outcome, task-skill state,
    action progress, and current contract.
  expected_chain:
    - SemanticAction
    - TargetBinding
    - ExecutionPolicy
    - VerificationPolicy
    - SafetyPolicy
    - ActionContract
    - ExecutionAttempt
    - ActionOutcome

architecture_position:
  current_progress_authority: legacy_taskplan_subgoal_planprogress
  target_for_this_slice: canonical_execution_result_only
  progress_authority_change: prohibited
  finish_authority_change: prohibited
  recovery_authority_change: prohibited
  coordinator_reduction: not_expected_until_sar_7_to_sar_9
  coordinator_policy: growth_frozen_not_reduced

included:
  - group ActionContract fields under typed semantic/target/execution/verification/safety owners
  - introduce or harden ExecutionAttempt as the single pre-execution identity envelope
  - introduce or harden ActionOutcome as the single canonical post-execution result
  - emit at most one canonical ActionOutcomeRecorded event per execution
  - move full route scores and alternative candidates to trace or diagnostics instead of contract authority
  - preserve lease, fingerprint, route selection, capability, approval, preflight, and verifier safety semantics
  - add RED/GREEN tests for stale identity, approval revalidation, preflight rebound, hash scope, and executor ticket invisibility

minimum_same_unit_one_out_deletions:
  - BoundActionExecution default production path
  - attribution ticket execution sidecar in default execution flow
  - duplicate contract/execution identity fields
  - ActionContract analytics route-score authority fields
  - ActionContract full alternative-candidate authority fields
  - multiple competing final action result events as production progress inputs

excluded:
  - TaskProgress production cutover
  - finish-authority migration
  - TaskCompletionVerifier production cutover
  - Recovery protocol unification
  - PlannerResponse production cutover
  - PlannerContext retirement
  - canonical UnifiedObservation full cutover
  - terminal mini-framework deletion
  - ODG-9 attribution hookup
  - ODG-10 obligation commit
  - ODG-11 finish migration
  - PR breadth claim
  - promotion claim

mandatory_followups_before_sar_7:
  - sar_4_production_plannerresponse_provider_cutover_and_legacy_deletion
  - sar_5_canonical_scope_cutover_and_terminal_framework_deletion

hard_guardrails:
  - no_new_foundation_only_chain
  - every_canonical_object_requires_same_unit_legacy_deletion
  - no_second_execution_result_authority
  - no_second_progress_or_finish_authority
  - no_coordinator_shortening_by_relocating_unchanged_branches
  - total_core_complexity_must_decrease
  - executor_must_not_receive_progress_attribution_ticket
  - receipt_success_must_not_complete_progress
  - external_reward_must_not_complete_progress

coordinator_constraints:
  coordinator_py_ceiling: 3461
  run_sync_ceiling: 2034
  runcoordinator_method_ceiling: 26
  expected_result_for_sar_6: no_growth
  actual_reduction_stage: sar_7_to_sar_9

tests_required:
  focused:
    - preflight rebound identity is preserved in ExecutionAttempt
    - approval token is revalidated against canonical ActionContract hash
    - executor receives ActionContract but not attribution/progress ticket
    - ActionOutcome contains receipt status, post-observation identity, verification status, step identity, and evidence refs
    - ActionOutcomeRecorded is emitted at most once per execution
    - route scores and alternatives are trace diagnostics, not contract authority
    - stale contract hash is rejected
    - duplicate final action result inputs cannot both feed production progress
  negative:
    - receipt-only success cannot produce progress completion
    - external reward cannot produce progress completion
    - weak verification evidence cannot be promoted by ActionOutcome construction
    - missing post-observation identity is fail-closed for canonical outcome
  architecture:
    - Coordinator does not grow beyond current ceiling
    - StateKernel schema authority remains unchanged
    - progress/finish gates remain legacy until SAR-7
    - default execution has one canonical outcome surface

validation_plan:
  each_commit:
    - focused SAR-6 tests
    - architecture governance tests
    - ruff
    - mypy
    - git diff --check
  cutover_commit:
    - full pytest
    - uv build
  benchmark:
    pr_breadth_required_now: false
    first_expected_clean_6x2_node: sar_7_or_explicit_behavior_change
  claims:
    official_score_claimed: false
    promotion: held

rollback_triggers:
  - coordinator.py or run_sync ceiling increase
  - second execution result authority introduced
  - progress or finish authority changed before SAR-7
  - receipt or external reward becomes a completion authority
  - ActionOutcome duplicates instead of replaces legacy final result surfaces

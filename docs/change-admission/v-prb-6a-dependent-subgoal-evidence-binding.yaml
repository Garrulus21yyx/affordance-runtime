slice_id: v-prb-6a-dependent-subgoal-evidence-binding
parent_packet: docs/change-admission/v-prb-6-terminal-completion-guard.yaml
packet_role: child_diagnostic

base_revision: fa82c635d1ed3218ea7eb4d224e29138610f452f
change_type: vertical_failure_classification
agent_mode: single_agent
production_change_allowed: false

single_primary_owner: not_selected
candidate_owner: subgoal evidence binding / TaskPlan progress accounting
mechanism: dependent subgoal evidence attribution after semantic follow-up

source_evidence:
  clean_rerun: docs/evidence/runs/m8.2a-pr-breadth-d50a631/
  affected_episodes:
    - form-sequence:seed-0
    - form-sequence:seed-1
  observed_path:
    - BrowserGym official_reward is 1.0
    - slider subgoal is verifier-backed completed
    - semantic resolver selects a dependent checkbox/submit follow-up
    - later actions verify externally
    - TaskPlan progress remains incomplete before finish
    - Runtime rejects finish with planner cannot finish before verifier-backed subgoal completion

non_goals:
  - do not modify production code in this diagnostic packet
  - do not weaken the finish guard
  - do not mark Runtime done only because BrowserGym official_reward is 1.0
  - do not complete a subgoal from ExecutionReceipt.success
  - do not complete a subgoal from external reward
  - do not add task-name, URL, selector, coordinate, or benchmark-family branches
  - do not modify Prompt, model-call budget, retry budget, timeout, or cost
  - do not start immutable PlanningRequest unless the RED proves mutable planner input is the root cause

required_non_browsergym_red_tests:
  - later action evidence must not be rebound to a stale active subgoal
  - verifier-backed flag/checkbox evidence completes the intended dependent subgoal, not the previous completed subgoal
  - verifier-backed submit evidence completes the intended terminal dependent subgoal
  - dependency-not-ready blocks binding to the dependent subgoal
  - stale plan id or plan version rejects binding
  - wrong subgoal id rejects binding
  - receipt success alone must not complete any subgoal
  - external evaluator result must not complete any subgoal
  - all subgoals completed is required before finish is accepted

owner_selection_questions:
  - is the existing active-subgoal flow supposed to advance before follow-up action selection?
  - should semantic follow-up proposals carry a Runtime-owned TaskPlan progress binding?
  - should SubgoalEvidenceBinder bind verifier IDs from an intended subgoal rather than only state.plan_progress.active_subgoal_id?
  - can the owner be isolated outside RunCoordinator with typed input/output?

architecture_admission: not_evaluated
promotion_status: held
remote_ci: disabled

done_when:
  - compact trace projection is archived for both affected episodes
  - a non-BrowserGym RED reproduces the stale binding failure
  - one primary owner is selected
  - any production repair is moved to a separate child_production_slice packet

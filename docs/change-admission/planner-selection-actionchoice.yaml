scope:
  current_slice: ps_browsergym_click_actionchoice_cutover
  included:
    - Runtime-owned ActionChoice contract.
    - Runtime-owned ActionChoiceSet and ActionChoiceFailure result boundary.
    - Runtime-owned ActionSelection and ActionSelectionValidator.
    - ChoicePlanningRequest for the future multi-choice Step Planner selector.
    - ActionChoiceBuilder support for exact text-entry EQUALS criteria.
    - ActionChoiceBuilder support for slider numeric EQUALS via bounded
      press-key direction choice.
    - Zero/one/many dispatch semantics as a pure boundary.
    - Strict architecture gate registration for action_choice.py.
    - Strict Generalist request-only path auto-selects a unique Runtime-built
      ActionChoice before model invocation.
    - Exact text EQUALS and slider numeric EQUALS unique-choice cases return
      deterministic PlannerProposal compatibility output with
      runtime-action-choice provenance.
    - Strict page-observed text fallback is deleted from default Generalist
      Planner behavior.
    - Strict exact-value text fallback function and call site are deleted; tests
      now assert that strict Planner clarification paths do not synthesize
      action, target, or parameters without Runtime-built ActionChoice input.
    - Strict Generalist implements select(ChoicePlanningRequest) and exposes a
      choice-id-only model schema.
    - Multiple Runtime-built ActionChoices call the Step Planner selector only
      for choice_id and reject unknown selected choices.
    - Multiple-choice selections are converted back to PlannerProposal only as
      a temporary compatibility output for the current Coordinator consumer.
    - ActionChoiceBuilder now covers bounded checkbox IS_CHECKED activation,
      select IS_SELECTED option choice, and terminal IS_COMPLETED activation.
    - strict semantic_action_resolver.py is physically deleted from production
      source and removed from executable collaborator manifests.
    - Strict terminal-submit-after-text fallback is deleted from Generalist
      Planner; terminal submit actions must now come from Runtime-built
      ActionChoice terminal criteria rather than historical verified-text
      context synthesis.
    - ActionChoiceDispatcher validates async Step Planner selections after
      awaiting them; sync and async selector paths now share the same
      choice_id membership and identity validator.
    - Strict Generalist Runtime ActionChoice path uses ActionChoiceDispatcher
      for zero/one/many dispatch instead of maintaining a second local
      one-choice and multi-choice selection branch.
    - Strict public PlanningRequest path returns PlannerUnsupportedResponse for
      Runtime ActionChoiceFailure without calling the model or falling back to
      free PlannerProposal generation.
    - Invalid ActionChoice selection from the Step Planner is converted to a
      typed ActionChoiceFailure / PlannerUnsupportedResponse instead of raising
      through the dispatcher or falling back to free PlannerProposal generation.
    - PlannerUnsupportedResponse compatibility conversion preserves the typed
      unsupported reason_code in PlannerDecision.planner_context so the current
      Coordinator consumer can route ActionChoice failures into recovery
      without collapsing them to generic planner_failed.
    - ActionChoiceBuilder resolves narrow legacy submission subjects to a
      unique submit target through the active-step target resolver.
    - ActionChoiceBuilder distinguishes unresolved legacy target binding from
      matched targets with no feasible action; strict public PlanningRequest
      path now returns typed PlannerUnsupportedResponse for
      action_choice_target_unresolved instead of falling back to free
      PlannerProposal generation.
    - ActionChoiceBuilder resolves a unique exact-label legacy subject to the
      current semantic target id without fuzzy label or task-family matching.
    - ActionChoiceBuilder derives bounded HAS_CHANGED activation choices for
      activatable non-text, non-slider targets, covering BrowserGym click
      button without restoring free PlannerProposal fallback.
    - BrowserGym click-button strict generalist path now completes through a
      Runtime-built unique ActionChoice with zero Step Planner model calls.
  excluded:
    - Coordinator call-site integration.
    - Public PlannerPort replacement with select(choice_id).
    - Full provider path deletion of PlannerProposalCandidate schema.
    - ActionContract builder changes.
    - Executor, verifier, preflight, approval, or capability changes.
    - Task Planner action-family retirement.
    - TargetIntent migration.
    - PR breadth, fresh diagnostic, or promotion claim.


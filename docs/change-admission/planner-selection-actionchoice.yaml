scope:
  current_slice: ps_1_ps_2_actionchoice_contracts_dispatch_and_first_default_cutover
  included:
    - Runtime-owned ActionChoice contract.
    - Runtime-owned ActionChoiceSet and ActionChoiceFailure result boundary.
    - Runtime-owned ActionSelection and ActionSelectionValidator.
    - ChoicePlanningRequest for the future multi-choice Step Planner selector.
    - ActionChoiceBuilder support for exact text-entry EQUALS criteria.
    - ActionChoiceBuilder support for slider numeric EQUALS via bounded
      press-key direction choice.
    - Zero/one/many dispatch semantics as a pure boundary.
    - Strict architecture gate registration for action_choice.py.
    - Strict Generalist request-only path auto-selects a unique Runtime-built
      ActionChoice before model invocation.
    - Exact text EQUALS and slider numeric EQUALS unique-choice cases return
      deterministic PlannerProposal compatibility output with
      runtime-action-choice provenance.
    - Strict page-observed text fallback is deleted from default Generalist
      Planner behavior.
    - Strict exact-value text fallback function and call site are deleted; the
      remaining legacy exact-value test passes only through the older semantic
      resolver compatibility path and is pending PS-4 retirement.
  excluded:
    - Coordinator call-site integration.
    - PlannerPort replacement with select(choice_id).
    - Provider schema changes.
    - ActionContract builder changes.
    - Executor, verifier, preflight, approval, or capability changes.
    - Full deterministic fallback deletion.
    - Task Planner action-family retirement.
    - TargetIntent migration.
    - PR breadth, fresh diagnostic, or promotion claim.


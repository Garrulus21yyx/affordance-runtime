dispatch_rules:
  zero_choices:
    result: typed_failure
    planner_called: false
  one_choice:
    result: runtime_action_selection
    planner_called: false
  multiple_choices:
    result: StepPlannerPort_selects_choice_id_future_boundary
    planner_called: true
    validator: choice_id_membership_and_identity_only


slice_id: odg-7-attribution-ticket-resolver
parent_decision: docs/change-admission/odg-0-obligation-driven-progress-architecture.yaml
depends_on:
  - docs/change-admission/odg-6-1-shared-attribution-contract-hardening.yaml
decision_date: 2026-07-28
base_revision: 6b182d4df7be00af2311681018eab1c3a1224e76
change_type: attribution_ticket_foundation
agent_mode: single_agent
production_behavior_change: false
production_writers: 1
remote_ci: disabled

single_primary_owner: Pre-action candidate obligation ticket resolution

goal: >
  Add an authority-free accepted-action view and candidate ticket resolver that
  scopes which ready canonical obligations a single action may later satisfy.
  The ticket is identity-bound and Runtime-owned; it does not declare any
  obligation satisfied and is not saved through Coordinator in this slice.

included:
  - AttributionActionView
  - ProgressAttributionTicket.contract_hash
  - ProgressAttributionTicket.compatibility_plan_id
  - ProgressAttributionTicket.compatibility_plan_version
  - ProgressAttributionTicketResolution
  - ProgressAttributionTicketResolver
  - deterministic ticket_id generation
  - ready-obligation candidate filtering
  - multiple candidate obligations in one ticket
  - dependency-ready filtering
  - progress-role filtering
  - stale task/progress/action identity rejection
  - role_pending propagation
  - action-kind compatibility checks
  - semantic-target compatibility checks

excluded:
  - Coordinator ticket storage
  - ActionContract schema changes
  - Executor ticket input
  - Verifier ticket input
  - post-action evidence normalization
  - post-verification attribution
  - StateKernel obligation ledger mutation
  - StateKernel.satisfy_task_obligation()
  - finish gate change
  - PlannerContext ready-obligation projection
  - Planner input or PlannerPort signature change
  - TaskPlan replacement or deletion semantics
  - BrowserGym adapter changes
  - benchmark rerun
  - fresh diagnostic
  - promotion claim

authority_rules:
  ticket_completion_authority: none
  model_authored_obligation_ids: prohibited
  planner_proposal_subgoal_input: prohibited
  taskplan_active_subgoal_input: prohibited
  input_allowed:
    - TaskSpec canonical obligation graph
    - ObligationProgressStateView
    - ReadyObligationProjection
    - AttributionActionView
  input_forbidden:
    - StateKernel
    - Coordinator
    - TraceDag
    - TaskPlan
    - PlannerProposal
    - ActionContract
    - ExecutionReceipt
    - BrowserGym official reward
    - task name
    - URL
    - selector
    - coordinate
    - benchmark family
  candidate_cardinality:
    multiple_candidates_allowed: true
    final_satisfaction_not_decided_pre_action: true
  writes_state: false
  writes_trace: false
  mutates_obligation_ledger: false
  changes_planner_input: false
  changes_finish_gate: false
  standard_path_authority: not_authorized
  dual_authority: false

tests:
  red_green:
    - tests/test_progress_attribution_ticket_resolver.py
  focused:
    - tests/test_progress_attribution_ticket_resolver.py
    - tests/test_obligation_progress.py
    - tests/test_obligation_ready_projection.py
    - tests/test_obligation_progress_ledger.py
  architecture:
    - tests/test_horizontal_architecture_governance.py
    - tests/test_r8_architecture_boundaries.py
    - tests/test_responsibility_containment.py

architecture_admission: pass
closure_status: ticket_resolver_foundation_only
promotion_status: held

next_requirement: >
  Continue with ODG-8 post-action evidence normalization as a separate
  foundation-only slice. ODG-8 must not pass tickets to Executor or Verifier,
  mutate the obligation ledger, perform ODG-9 attribution, change finish
  authority, change PlannerContext, run PR breadth, or claim promotion.

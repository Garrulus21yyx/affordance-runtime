scope:
  current_record: for_3_structured_owner_handoff_local_candidate
  included:
    - Add FailureOwnerHandoff as the typed non-runtime owner handoff contract.
    - Add FailureOwnerHandoffDecision to bind RecoveryDecision compatibility output to the structured handoff.
    - Route existing non-runtime owner decision construction through build_failure_owner_handoff().
    - Preserve explicit owner, target phase, changed dimensions, replan scope, user question, and reason code.
    - Reject RUNTIME_RECOVERY owner at the non-runtime handoff boundary.
    - Keep FailureEnvelope as the only failure model.
    - Keep RecoveryPhase and RecoveryCoordinator out of the handoff module.
  excluded:
    - Deleting the temporary handoff seam.
    - Removing semantic-owner RecoveryKind enum values.
    - Replacing Coordinator pending replan checks.
    - Planner ActionChoice interface changes.
    - StateKernel schema changes.
    - Progress or finish authority changes.
    - SAR-9 phase extraction.
    - PR breadth or promotion claims.

handoff_contract:
  input:
    - FailureEnvelope
    - FailureClassification
  output:
    - FailureOwnerHandoff
    - FailureOwnerHandoffDecision
  fields:
    owner: FailureOwner
    target_phase: RuntimePhase
    changed_dimensions: tuple[RecoveryDimension, ...]
    replan_scope: step_or_task_or_empty
    user_question: user_owned_only
  runtime_recovery_owner_allowed: false
  reverse_dependencies:
    RecoveryPhase: prohibited
    RecoveryCoordinator: prohibited

validation_policy:
  test_gate_level: subsystem
  focused:
    - python -m pytest tests/test_failure_owner_flow.py tests/test_horizontal_architecture_governance.py::test_for_3_failure_owner_flow_uses_structured_handoff_contracts -q --tb=short --maxfail=5
    - python -m pytest tests/test_generalist_planner.py tests/test_full_phase_recovery.py tests/test_coordinator.py -q --tb=short --maxfail=20
  static:
    - ruff check src/affordance_runtime/failure_owner_flow.py src/affordance_runtime/task_pipeline.py tests/test_failure_owner_flow.py tests/test_horizontal_architecture_governance.py
    - /home/yang/miniconda3/bin/python -m mypy --ignore-missing-imports src/affordance_runtime/failure_owner_flow.py src/affordance_runtime/task_pipeline.py
    - |
      python - <<'PY'
      import yaml
      from pathlib import Path
      for path in Path('docs/change-admission').glob('*.yaml'):
          yaml.safe_load(path.read_text())
      PY
    - git diff --check
  full_pytest:
    required: false
    trigger: FOR-4 closure or production behavioral cutover
  behavioral:
    pr_breadth: false
    fresh_diagnostic: false


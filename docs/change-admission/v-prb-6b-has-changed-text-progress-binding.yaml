problem_statement: >
  The BrowserGym adapter already declares exact typed value postconditions as
  active-subgoal evidence for EQUALS/MATCHES outcomes. The enter-text residual
  uses a Runtime-owned HAS_CHANGED text outcome with an exact concrete value.
  Its DOM postcondition passed, but remained task-terminal-only, so verifier
  evidence lost active subgoal criterion/requirement links before progress
  matching.


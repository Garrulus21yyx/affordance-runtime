slice_id: v-prb-6b-verifier-backed-progress-accounting
packet_role: child_green_contract
base_revision: 238cfee26cdf133c0fd7b4d936b0e2cfa49e7176
change_type: vertical_correctness
production_change_allowed: true

goal: >
  Establish a Core authority-free progress accounting contract for a ready,
  incomplete read-only TaskPlan subgoal that is already satisfied by the current
  independent observation. The required subgoal must remain in the authoritative
  TaskPlan and be completed through verifier-backed progress accounting, not
  deleted through replacement planning.

owner_before:
  - TaskPlanFlow current-state discard/replacement path
  - TaskPlanValidator obligation coverage guard

owner_after:
  proposed:
    - TaskPlanProgressReconciler
    - CurrentStateSubgoalCompletionFlow
  committer:
    - RunCoordinator
    - StateKernel.complete_subgoal

typed_contract:
  module: src/affordance_runtime/task_plan_progress.py
  state_view: TaskPlanProgressStateView
  current_evidence: CurrentStateEvidence
  result: SubgoalCompletionPreparation
  evaluator: CurrentStateSubgoalCompletionEvaluator

first_slice_relations:
  - is_available
  - is_visible

non_goals:
  - do not broaden BrowserGym text evidence
  - do not reintroduce empty-value HAS_CHANGED fill-delta behavior
  - do not delete required obligation subgoals
  - do not weaken TaskPlanValidator obligation_subgoal_missing
  - do not weaken finish guard
  - do not use BrowserGym reward, ExecutionReceipt success, task name, URL, selector, or model proposal as completion authority
  - do not implement V-PRB-6A explicit progress target in this slice
  - do not migrate immutable Planner input in this slice

red_tests:
  ordinary_suite:
    command: "$PY -m pytest -q tests/test_task_plan_progress.py"
    expected: "strict xfail until src/affordance_runtime/task_plan_progress.py exists"
  forced_red:
    command: "$PY -m pytest -q tests/test_task_plan_progress.py --runxfail"
    expected: "fails because the task_plan_progress contract is not implemented"

green_implementation:
  production_module: src/affordance_runtime/task_plan_progress.py
  implemented_contracts:
    - TaskPlanProgressStateView
    - CurrentStateEvidence
    - SubgoalCompletionPreparation
    - CurrentStateSubgoalCompletionEvaluator
  implemented_relations:
    - is_available
    - is_visible
  current_integration: evaluator_only
  coordinator_commit_path: not_connected_in_this_slice
  old_replacement_path_removed: false

green_tests:
  focused:
    command: "$PY -m pytest -q tests/test_task_plan_progress.py"
    result: "6 passed"
  related_regression:
    command: "$PY -m pytest -q tests/test_planning.py tests/test_task_plan_flow.py tests/test_task_plan_lifecycle.py tests/test_task_plan_progress.py"
    result: "58 passed"
  architecture:
    command: "$PY -m pytest -q tests/test_horizontal_architecture_governance.py tests/test_r8_architecture_boundaries.py tests/test_responsibility_containment.py tests/test_generalist_governance_matrix.py"
    result: "41 passed"
  static:
    command: "$PY -m ruff check src tests scripts && $PY -m mypy --ignore-missing-imports src && git diff --check"
    result: "pass; mypy checked 119 source files"

architecture_admission:
  required: true
  waiver_allowed: false
  initial_status: pass_local_focused

promotion:
  official_score_claimed: false
  pr_breadth_acceptance: held
  fresh_diagnostic: not_authorized

slice_id: odg-2-obligation-progress-contracts
parent_decision: docs/change-admission/odg-0-obligation-driven-progress-architecture.yaml
decision_date: 2026-07-28
base_revision: aa779c8ae7905c95e26c2dc65b1434285b9c086d
change_type: architecture_foundation_contracts
agent_mode: single_agent
production_change_allowed: true
production_behavior_change: false
production_writers: 1
remote_ci: disabled

single_primary_owner: Canonical obligation progress contracts

goal: >
  Add the typed, authority-free ODG-2 contracts required before any
  StateKernel ledger, Coordinator commit, PlannerContext migration, or
  BrowserGym rerun. The contracts make canonical obligation IDs the target
  progress unit while preserving TaskPlan as compatibility-only authority.

included:
  - ObligationExecutionRole
  - TaskObligationExecutionView
  - ObligationProgressStateView
  - ReadyObligationView
  - ready_obligation_ids()
  - task_obligations_completed()
  - ProgressAttributionTicket
  - PostActionEvidenceFact
  - ObligationAttributionResult
  - ObligationSatisfactionPreparation

excluded:
  - StateKernel obligation ledger
  - Coordinator obligation satisfaction commit
  - PlannerContext ready-obligation projection
  - TaskPlan optionalization
  - TaskPlanLifecycle finish-gate replacement
  - BrowserGym adapter changes
  - PR breadth / fresh diagnostic / promotion

authority_rules:
  role_source: explicit TaskObligationExecutionView
  missing_role: fail_closed
  extra_role: fail_closed
  ready_state_source:
    - TaskSpec canonical dependency graph
    - ObligationProgressStateView satisfied/failed ids
  skipped_roles:
    - PRECONDITION
    - EVIDENCE_ONLY
  progress_roles:
    - PROGRESS_EFFECT
    - TERMINAL_EFFECT
  completion_rule: >
    All blocking progress roles must be satisfied and at least one terminal
    effect must be satisfied. TaskPlan active/completed subgoal state is not
    consulted.

forbidden:
  - StateKernel mutation
  - Coordinator mutation
  - TraceDag write
  - Planner invocation
  - TaskPlan deletion or replacement
  - BrowserGym evidence broadening
  - receipt success completion
  - external reward completion
  - model-authored obligation completion

tests:
  red_to_green:
    - tests/test_obligation_progress.py::test_ready_obligations_come_from_graph_dependencies_and_progress_roles
    - tests/test_obligation_progress.py::test_ready_projection_rejects_missing_or_extra_execution_role_views
    - tests/test_obligation_progress.py::test_task_completion_uses_blocking_effect_obligations_not_taskplan_state
    - tests/test_obligation_progress.py::test_attribution_ticket_and_satisfaction_preparation_are_identity_bound
    - tests/test_obligation_progress.py::test_attribution_contracts_fail_closed_on_blank_or_duplicate_identity
  red_observed: >
    Initial focused run failed because affordance_runtime.obligation_attribution
    and affordance_runtime.obligation_progress did not exist.

architecture_admission: pass
closure_status: foundation_only
promotion_status: held

next_requirement: >
  Continue with ODG-3 StateKernel shadow ledger or ODG-4 ready scheduler
  integration only after adding non-BrowserGym REDs. Do not connect
  ObligationSatisfactionPreparation to Coordinator or finish until shadow
  comparison evidence exists.

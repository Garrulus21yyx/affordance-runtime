  full_local_gate:
    - python -m pytest -q
    - python -m ruff check src tests scripts
    - python -m mypy --ignore-missing-imports src
    - uv build
    - git diff --check

runtime_effect:
  planner_behavior_changed: false
  standard_planner_signature_changed: false
  coordinator_changed: false
  statekernel_changed: false
  taskplan_changed: false
  browsergym_changed: false


  DecisionConstraintSet: deeply immutable constraint result contract

included:
  - PlannerStepProjectionStatus
  - PlannerStepView projection_status and projection_reason
  - stale / invalid projection preservation instead of no-plan folding
  - invalid projection effectful-action suppression in PlanningRequestBuilder
  - PlannerAdmissionView foundation contract
  - TargetAdmissionDecision foundation contract
  - PlannerAdmissionSummary foundation contract
  - DecisionConstraintSet compatible-target deep immutability

excluded:
  - legacy terminal admission projector
  - DecisionConstraintBuilder request-only path
  - GeneralistLMPlanner request-only core
  - PlannerPort signature cutover
  - Coordinator call site change
  - TaskPlanAuthority production cutover
  - active-step progress cutover
  - finish-authority change
  - ODG-9 / ODG-10 / ODG-11
  - PR breadth claim
  - promotion

authority:
  plan_generation: unchanged
  plan_decision: unchanged
  plan_commit: RunCoordinator
  progress_authority: legacy_taskplan_subgoal_planprogress
  planner_input_authority: PlanningRequest projection
  terminal_admission_authority: not_connected
  state_writer: unchanged
  trace_writer: unchanged

required_invariants:
  - stale and invalid Step projection status must not be represented as ordinary no-plan
  - stale and invalid Step projection requests must not authorize effectful action kinds
  - PlannerAdmissionView must be task-revision and snapshot bound
  - excluded target IDs must be present in typed target decisions
  - blocked and unknown target admissions must carry typed step IDs
  - DecisionConstraintSet must not retain mutable compatible-target mappings
  - no runtime behavior, Coordinator path, or PlannerPort signature changes are authorized by this slice

tests:

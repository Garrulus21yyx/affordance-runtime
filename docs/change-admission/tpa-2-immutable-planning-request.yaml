slice_id: tpa-2-immutable-planning-request
parent_decision: tpa-0-taskplan-authority-freeze
base_revision: 7cf854b1dc85805d958b6553c9f71b3434b14c31
change_type: planner_input_boundary_foundation
production_behavior_change: false
production_writers: 1

single_primary_owner:
  PlanningRequestBuilder: sole read-only projection owner for TaskEnvelope, StateKernel, BrowserSnapshot, and legacy Step projection

included:
  - immutable PlanningRequestIdentity
  - immutable PlannerTaskView
  - immutable PlannerStepView
  - immutable PlannerObservationView
  - immutable PlannerAffordanceView
  - PlannerOutcomeSummary
  - PlannerRecoverySummary
  - RuntimeBudgetView
  - PlanningRequestLimits
  - PlanningRequestBuilder foundation
  - exact legacy Step projection reuse
  - task completion criterion projection status
  - read-only StateKernel version guard

excluded:
  - plannerport_cutover
  - coordinator_call_site_change
  - PlannerContextBuilder migration
  - StrictDecisionConstraintBuilder migration
  - TaskPlan admission change
  - TaskPlanAuthority production implementation
  - progress authority change
  - finish authority change
  - trace writes
  - benchmark rerun
  - PR breadth claim
  - promotion

authority:
  plan_generation: unchanged
  plan_decision: unchanged
  plan_commit: RunCoordinator
  progress_authority: legacy_taskplan_subgoal_planprogress
  planner_input_authority: PlanningRequestBuilder foundation only
  state_writer: unchanged
  trace_writer: unchanged

required_invariants:
  - PlanningRequest contracts must not import StateKernel, TaskEnvelope, BrowserSnapshot, Coordinator, trace, adapters, or benchmarks
  - PlanningRequestBuilder may read StateKernel, TaskEnvelope, BrowserSnapshot, and legacy Step projection
  - PlanningRequestBuilder must not call StateKernel mutation methods
  - PlanningRequestBuilder must not write TraceDag
  - PlanningRequestBuilder must not invoke PlannerPort
  - PlanningRequestBuilder must not activate a ready step
  - PlanningRequest nested collections must be deeply immutable
  - PlanningRequest must not expose raw StateKernel, TaskEnvelope, or BrowserSnapshot
  - completed legacy plans must expose no active step
  - ready-not-activated legacy plans must remain unactivated

tests:
  focused:
    - tests/test_planning_request.py
    - tests/test_planning_request_builder.py
  architecture:
    - tests/test_horizontal_architecture_governance.py
  full_local_gate:
    - python -m pytest -q
    - python -m ruff check src tests scripts
    - python -m mypy --ignore-missing-imports src
    - uv build
    - git diff --check

runtime_effect:
  planner_behavior_changed: false
  standard_planner_signature_changed: false
  coordinator_changed: false
  statekernel_changed: false
  taskplan_changed: false
  browsergym_changed: false

closure_status: request_contracts_and_builder_foundation
next_slice: tpa-3-stepplannerport-request-only-cutover
promotion_status: held

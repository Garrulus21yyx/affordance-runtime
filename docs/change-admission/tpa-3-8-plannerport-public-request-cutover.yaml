slice_id: tpa-3-8-plannerport-public-request-cutover
parent_decision: tpa-0-taskplan-authority-freeze
base_revision: 65dab6b6eb7f11df912700c6f2a753a225d00ffc
change_type: planner_public_contract_cutover
production_behavior_change: false
production_writers: 1

single_primary_owner:
  Standard Step Planner public input boundary

included:
  - PlannerPort public signature becomes propose(PlanningRequest)
  - planning_contracts.py imports PlanningRequest but no StateKernel, TaskEnvelope, or BrowserSnapshot
  - Coordinator builds PlanningRequest before invoking the planner boundary when a validated TaskSpec exists
  - legacy three-argument planners are isolated behind planner_compatibility.py
  - RunCoordinator field accepts PlannerCompatibilityPort during the migration window
  - CLI reference planner registry is typed as the compatibility union
  - architecture tests record the standard request-only contract and the named legacy seam

excluded:
  - converting legacy ActionContract-returning planners to pure semantic proposal planners
  - deleting legacy benchmark/reference fixture planners
  - ActionContract schema changes
  - PlannerContext payload changes
  - TaskPlanAuthority production cutover
  - TaskPlan admission changes
  - active-step production authority cutover
  - progress authority changes
  - finish gate changes
  - ODG-9 hookup
  - ODG-10 obligation commit
  - ODG-11 finish migration
  - PR breadth claim
  - promotion

authority:
  planner_input_authority: PlanningRequestBuilder
  planner_output_authority: PlannerDecision
  state_writer: RunCoordinator
  trace_writer: RunCoordinator
  taskplan_authority: legacy TaskPlanFlow / TaskPlanLifecycle
  progress_authority: legacy TaskPlan / PlanProgress
  compatibility_seam: planner_compatibility.py

invariants:
  - PlannerPort no longer exposes mutable StateKernel, TaskEnvelope, or BrowserSnapshot
  - PlanningRequestBuilder remains the only standard projection owner that reads envelope/state/snapshot together
  - legacy three-argument propose calls are not made directly in Coordinator
  - legacy three-argument planners remain compatibility-only until their ActionContract binding responsibilities are retired
  - compatibility seam must not write StateKernel or TraceDag
  - no benchmark task name, URL, selector, coordinate, official reward, or external evaluator value becomes PlannerPort authority
  - Coordinator method count must not increase
  - Coordinator line ceiling must not increase

tests_required:
  - planning_contracts PlannerPort accepts only PlanningRequest
  - planning_contracts does not import StateKernel, TaskEnvelope, or BrowserSnapshot
  - Coordinator builds PlanningRequest and invokes the compatibility seam
  - Coordinator no longer directly calls self.planner.propose(envelope, state, snapshot)
  - legacy fixture planners still run through compatibility without behavior changes
  - full local pytest
  - ruff
  - mypy
  - uv build
  - git diff --check

closure_status: plannerport_public_request_cutover_foundation
next_slice: tpa-4-taskplan-authority-contracts
promotion_status: held

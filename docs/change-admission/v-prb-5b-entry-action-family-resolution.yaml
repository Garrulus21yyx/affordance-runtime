slice_id: v-prb-5b-entry-action-family-resolution
parent_packet: docs/change-admission/v-prb-5-downstream-planning-follow-up.yaml
packet_role: child_diagnostic

base_revision: c072bdf
implementation_revisions:
  - 5c7a2abf17c6e15f497cb613856730ddd9080242
  - 2b67ffd
closure_rerun_revision: 3daf779bb8d1b6fb6c4e8a73c31fd00c514668fd
change_type: vertical_repair
agent_mode: single_agent
production_change_allowed: true

single_primary_owner: task_action_family_resolution
mechanism: typed entry action-family resolution

source_evidence:
  clean_rerun: docs/evidence/runs/m8.2a-pr-breadth-c24b277/
  affected_episodes:
    - form-sequence:seed-0
    - form-sequence:seed-1
  observed_path:
    - TaskSpec is created
    - TaskPlan proposal has three subgoals
    - first slider obligation is reversible_write / has_changed
    - TaskPlanValidator requires type_text as the bindable action family
    - page affords slider press_key, checkbox activate, submit activate
    - compact_context / repair_model_schema / replan_task does not clear the rejection

review_refinement:
  current_hypothesis: >
    The failure is more likely in typed TaskPlan action-family resolution than
    in Prompt repair, TaskPlan retry, planner context compaction, or
    Coordinator/StateKernel behavior. Lexical subject terms must not override a
    typed current affordance that exposes slider-style press_key behavior.
  primary_risks:
    - reversible_write plus has_changed currently leans toward TYPE_TEXT when subject terms look like field/input/text/date/value
    - slider value can be misclassified as TYPE_TEXT even when current typed affordances expose press_key
    - ambiguous affordance support must fail closed instead of guessing an executable family

non_goals:
  - do not modify Coordinator
  - do not modify StateKernel
  - do not modify PlannerPort or introduce PlanningRequest
  - do not modify Prompt, model-call budget, retry budget, timeout, or cost
  - do not add task-name, URL, selector, coordinate, or benchmark-family branches
  - do not combine with V-PRB-5A or V-PRB-6

required_non_browsergym_red_tests:
  - slider-like reversible_write / has_changed with typed press_key affordance must not infer TYPE_TEXT
  - slider-like reversible_write / has_changed should resolve to PRESS_KEY or remain unresolved when not unique
  - ordinary textbox exact-value entry still resolves to TYPE_TEXT
  - button activation does not resolve to TYPE_TEXT
  - simultaneous press_key and drag without enough evidence remains unresolved
  - no current affordance means no executable family is generated

candidate_owner:
  module: task_action_family_resolution.py
  output_type: action family value or unresolved
  allowed_inputs:
    - TaskObligationSpec
    - typed current planning environment / affordance summary
  forbidden_inputs:
    - task name
    - URL
    - selector
    - coordinate
    - StateKernel
    - Coordinator

done_when:
  - non-BrowserGym RED turns GREEN
  - form-sequence no longer rejects only because TYPE_TEXT is required for a slider press_key affordance
  - ambiguity remains fail-closed
  - resolver is added to the executable authority-free collaborator manifest if introduced
  - no task grammar, Prompt, budget, adapter-specific, Coordinator, or StateKernel change is added
  - clean PR breadth matrix is rerun after a production repair commit

implementation:
  first_repair:
    revision: 5c7a2abf17c6e15f497cb613856730ddd9080242
    summary: >
      Introduced an authority-free resolver and made reversible-write
      obligations prefer unique current affordance evidence; slider value
      changes with a typed press_key affordance no longer infer TYPE_TEXT.
  first_rerun:
    evidence: docs/evidence/runs/m8.2a-pr-breadth-5c7a2ab/
    result: >
      Negative PR breadth evidence: 12/12 observed, 8/12 official reward
      passed, 4 Runtime failures, no provider/missing/unrun/invalidated cases.
      The original form-sequence entry_action_family_unavailable rejection no
      longer reproduces, but enter-text regressed to empty ask_user /
      planner_waiting_clarification because textbox affordances with labels
      such as "tt" did not match text_field subjects.
  second_repair:
    revision: 2b67ffd
    summary: >
      Restored textbox value-entry inference from typed current affordance
      role/support when lexical subject and label tokens do not overlap.
  closure_rerun:
    evidence: docs/evidence/runs/m8.2a-pr-breadth-3daf779/
    result: >
      Negative PR breadth evidence but positive V-PRB-5B closure: 12/12
      observed, 10/12 official reward passed, 3 Runtime failures, no
      provider/missing/unrun/invalidated cases. The original form-sequence
      entry_action_family_unavailable rejection remains closed, enter-text
      seed 0 is restored, and remaining form-sequence failures are strict
      planner empty ask_user proposals after accepted TaskPlans with press_key
      permitted.

verification:
  focused_tests:
    - tests/test_task_planning.py::test_obligation_compiler_uses_current_affordance_for_slider_value_change
    - tests/test_task_planning.py::test_obligation_compiler_uses_textbox_affordance_for_text_field_change
    - tests/test_task_planning.py::test_obligation_compiler_leaves_ambiguous_current_affordance_family_unresolved
  local_gates:
    - full pytest: 981 passed
    - ruff: passed
    - mypy: passed over 118 source files
    - diff check: passed
    - task_planning.py line ceiling: 1641 <= 1642
  build_gate: environment-blocked; isolated build cannot create python3.12 venv because ensurepip/python3.12-venv is missing, and the BrowserGym venv lacks setuptools.build_meta

architecture_admission: pass
promotion_status: held
remote_ci: disabled
closure_status: done_for_current_pr_breadth_matrix
follow_up:
  - V-PRB-5C form-sequence strict-planner empty proposal generation
  - V-PRB-6 enter-text seed-1 terminal completion guard

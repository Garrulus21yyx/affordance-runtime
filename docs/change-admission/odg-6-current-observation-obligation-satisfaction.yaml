slice_id: odg-6-current-observation-obligation-satisfaction
parent_decision: docs/change-admission/odg-0-obligation-driven-progress-architecture.yaml
decision_date: 2026-07-28
base_revision: f8710f38398f555206e9dd48259c3ac56f050e3e
change_type: architecture_progress_attribution_foundation
agent_mode: single_agent
production_behavior_change: false
production_writers: 1
remote_ci: disabled

single_primary_owner: Current-observation canonical obligation satisfaction preparation

goal: >
  Add an authority-free evaluator that can prepare satisfaction for explicitly
  role-resolved canonical obligations whose IS_AVAILABLE or IS_VISIBLE relation
  is independently proven by the current observation. This foundation keeps
  Coordinator, StateKernel, PlannerContext, TaskPlan, finish authority,
  BrowserGym adapters, and benchmark evidence unchanged.

included:
  - CurrentObservationAffordanceFact
  - CurrentObservationObligationSatisfactionEvaluator
  - role-aware filtering through TaskObligationExecutionView
  - canonical TaskSpec identity validation through ObligationProgressStateView
  - IS_AVAILABLE current-observation satisfaction
  - IS_VISIBLE current-observation satisfaction
  - unique target matching by typed subject and relation
  - dependency-ready fail-closed checks
  - stale task/progress/observation identity rejection
  - ambiguity fail-closed behavior
  - ObligationSatisfactionPreparation with source current_observation

excluded:
  - Coordinator satisfaction commit
  - StateKernel.satisfy_task_obligation()
  - StateKernel obligation ledger initialization or mutation
  - finish gate change
  - PlannerContext ready-obligation projection
  - Planner input or PlannerPort signature change
  - TaskPlan replacement or deletion semantics
  - TaskPlanLifecycle authority change
  - post-action attribution
  - form-sequence dependent-subgoal evidence binding
  - BrowserGym adapter changes
  - benchmark rerun
  - fresh diagnostic
  - promotion claim

authority_rules:
  input_allowed:
    - TaskSpec canonical obligation graph
    - ObligationProgressStateView
    - TaskObligationExecutionView
    - CurrentObservationAffordanceFact
  input_forbidden:
    - StateKernel
    - Coordinator
    - TraceDag
    - TaskPlan
    - ExecutionReceipt
    - BrowserGym official reward
    - model proposal
    - task name
    - URL
    - selector
    - coordinate
    - benchmark family
  supported_relations:
    - IS_AVAILABLE
    - IS_VISIBLE
  unsupported_relations:
    - HAS_CHANGED
    - IS_CHECKED
    - IS_SELECTED
    - IS_COMPLETED
  standard_path_authority: not_authorized
  dual_authority: false
  writes_state: false
  writes_trace: false
  mutates_obligation_ledger: false
  changes_planner_input: false
  changes_finish_gate: false

tests:
  red_green:
    - tests/test_current_observation_obligation_satisfaction.py
  focused:
    - tests/test_current_observation_obligation_satisfaction.py
    - tests/test_obligation_progress.py
    - tests/test_obligation_ready_projection.py
  architecture:
    - tests/test_horizontal_architecture_governance.py
    - tests/test_r8_architecture_boundaries.py
    - tests/test_responsibility_containment.py

architecture_admission: pass
closure_status: foundation_evaluator_only
promotion_status: held

next_requirement: >
  Continue with ODG-7 attribution ticket or an explicitly authorized ODG-6
  shadow diagnostic hookup only after preserving the same boundaries. Standard
  obligation satisfaction commit remains ODG-10, finish authority remains
  ODG-11, and immutable Planner input remains deferred until the obligation
  projection shape is stable.

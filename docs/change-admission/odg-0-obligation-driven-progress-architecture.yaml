slice_id: odg-0-obligation-driven-progress-architecture
decision_date: 2026-07-28
base_revision: fa1037e2788261a1c76edce96a80b02df1461a3d
change_type: architecture_decision
agent_mode: single_agent
production_change_allowed: false
production_writers: 0
remote_ci: disabled

decision:
  title: Canonical Obligation Graph is the sole authoritative progress model
  summary: >
    Runtime progress authority moves from TaskPlan/PlanProgress subgoal
    completion toward the canonical TaskSpec obligation graph. The Agent and
    Planner continue step-by-step planning, but TaskPlan is downgraded to an
    optional execution strategy view rather than a second completion fact
    source.

authority_model:
  source_lineage_authority: SourceLedger
  progress_graph_authority: Canonical Obligation Graph
  mutable_state_authority: StateKernel
  progress_commit_authority: RunCoordinator
  action_authority: ActionContract
  safety_authority:
    - Capability
    - Approval
    - Risk
    - Preflight
  completion_evidence_authority: Independent Verifier
  trace_authority: RunCoordinator

standard_path:
  - SourceLedger
  - TaskSpec + Canonical Obligation Graph
  - Ready Obligation Projection
  - PlanningRequest
  - PlannerProposal
  - ActionContract + ProgressAttributionTicket
  - Execute
  - Post-action Observation
  - Verifier
  - Obligation Progress Attributor
  - Coordinator commits Obligation Satisfaction
  - next Agent turn

retained_foundations:
  source_ledger: retained
  canonical_obligation_graph: sole_progress_authority_target
  planner_neutrality: planner_outputs_semantic_proposals_only
  action_contract: retained
  capability_approval_risk_preflight: retained
  independent_verifier: retained
  state_kernel: retained_as_authoritative_mutable_runtime_state
  coordinator: retained_as_only_progress_state_trace_committer
  adapter_boundaries: retained
  trace_evidence_benchmark_governance: retained
  recovery: retained

downgraded_or_retired_targets:
  task_plan_completion_authority: optional_execution_strategy_view
  subgoal_spec_progress_unit: replaced_by_obligation_id
  plan_progress_completed_subgoal_ids: replaced_by_obligation_progress_ledger
  active_subgoal_evidence_owner: replaced_by_post_verification_attribution
  task_plan_lifecycle_completed_gate: replaced_by_obligation_completion_policy
  mandatory_obligation_to_subgoal_copy: removed_from_standard_path
  obligation_subgoal_missing: compatibility_taskplan_validation_only
  current_state_satisfied_subgoal_deletion: prohibited
  subgoal_evidence_binder: compatibility_adapter
  task_plan_flow_required_for_all_tasks: optional_strategy_only

v_prb_6a_foundation_redirect:

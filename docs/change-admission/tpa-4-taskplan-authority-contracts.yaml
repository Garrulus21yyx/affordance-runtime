slice_id: tpa-4-taskplan-authority-contracts
parent_decision: tpa-0-taskplan-authority-freeze
base_revision: 8ccabc1e0f9de41fe45aa01d1387c5207c122152
change_type: authority_contract_foundation
production_behavior_change: false
standard_path_authority: unchanged
coordinator_integration: prohibited
statekernel_mutation: prohibited
taskplan_generator_migration: prohibited

single_primary_owner:
  TaskPlanAuthority neutral draft, request, decision, and generator contracts

included:
  - TaskPlanDraft contract
  - InitialTaskPlanRequest contract
  - TaskPlanRevisionRequest contract
  - TaskPlanRevisionTrigger contract
  - PlanIssueReport contract
  - TaskPlanDecision contract
  - TaskPlanAuthorityBinder foundation
  - TaskPlanGeneratorPort foundation
  - deterministic plan identity and digest binding tests

excluded:
  - TaskPlanAuthority production admission
  - TaskPlan generator migration
  - Coordinator plan-commit rewiring
  - StateKernel install or replace changes
  - TaskPlanLifecycle replacement
  - active-step progress cutover
  - finish-authority migration
  - ODG-9 hookup
  - ODG-10 obligation commit
  - ODG-11 finish migration
  - PR breadth claim
  - promotion

authority_invariants:
  plan_generation_current_authority: legacy TaskPlannerPort
  plan_admission_current_authority: TaskPlanLifecycle plus TaskPlanValidator
  plan_commit_owner: RunCoordinator
  plan_storage_owner: StateKernel
  progress_authority: legacy TaskPlan plus PlanProgress
  taskplan_authority_standard_path: not_authorized
  dual_progress_authority: prohibited

contract_invariants:
  draft_cannot_include_runtime_authority_fields: true
  generator_returns_only_taskplan_draft: true
  initial_and_revision_requests_are_distinct: true
  plan_issue_report_cannot_carry_plan_patch: true
  accepted_decision_requires_plan_and_digest: true
  rejected_or_repair_or_clarification_decision_cannot_carry_plan: true
  binder_owns_plan_identity_and_version_fields: true
  same_request_and_draft_produce_same_plan_identity: true

validation:
  focused_contract_tests: required
  architecture_tests: required
  full_pytest: required
  ruff: required
  mypy: required
  uv_build: required
  diff_check: required
  pr_breadth: not_required

closure_status: taskplan_authority_contracts_foundation

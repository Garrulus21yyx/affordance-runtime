scope:
  current_slice: sar-8a-failure-taxonomy-and-strategy-selection
  included:
    - SAR-8 FailureKind taxonomy.
    - Pure FailureEnvelope to FailureKind classifier.
    - RecoveryCoordinator strategy selection routed through FailureKind instead
      of raw phase/class mapping.
    - planner_waiting_clarification maps to internal model/context/provider
      recovery, not default ask_user or replan.
    - entry_outcome_already_satisfied maps to current-step progress precheck
      owner and is not treated as replan/ask_user recovery.
  excluded:
    - Coordinator recovery call-site rewrite.
    - RecoveryCommand / RecoveryPlan / RecoveryReceipt physical deletion.
    - legacy RecoveryAction / RecoveryIncident / RecoveryAttempt deletion.
    - Planner ActionChoiceBuilder.
    - new task-family regex or deterministic fallback.
    - PR breadth, fresh diagnostic, or promotion claim.

failure_kind_policy:
  model_deferral_with_action_space:
    default_strategy_order:
      - compact_context
      - repair_model_schema
      - switch_provider
      - abort
    ask_user_default: false
    replan_default: false
    same_context_no_op_retry: false
  current_step_already_satisfied:
    owner: progress_precheck
    recovery_strategy_order:
      - abort
    normal_runtime_path: complete_step_then_continue
  missing_user_input:
    default_strategy_order:
      - ask_user
      - abort

remaining_sar_8_work:
  - Replace RecoveryCommand/RecoveryPlan/RecoveryReceipt and legacy
    RecoveryAction/Incident/Attempt/Cascade with a single RecoveryDecision and
    RecoveryOutcome protocol.
  - Rewire Coordinator to consume the unified protocol while deleting old
    branches instead of adding new ones.
  - Preserve the planner clarification distinction learned from SAR-7 fresh
    diagnostic classification.


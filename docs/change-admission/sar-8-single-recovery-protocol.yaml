scope:
  current_slice: sar-8c-legacy-recovery-state-deletion-cutover
  included:
    - SAR-8 FailureKind taxonomy.
    - Pure FailureEnvelope to typed FailureClassification classifier.
    - RecoveryCoordinator strategy selection routed through FailureKind instead
      of raw phase/class mapping.
    - RecoveryCoordinator.decide() returns canonical RecoveryDecision.
    - RunCoordinator phase-general recovery entry calls decide() before the
      temporary legacy adapter.
    - RecoveryPhase is the Coordinator-facing recovery application seam for
      phase-general failures.
    - RunCoordinator._recover_phase_failure() delegates decision, adapter,
      trace projection, owner-dispatch, and immediate terminal recovery
      completion to RecoveryPhase.
    - RunCoordinator contract-backed execution and verification failures route
      through RecoveryPhase instead of the legacy RecoveryHandler.
    - StateKernel no longer stores recovery_incident or recovery_diagnostics.
    - StateKernel stores canonical current_recovery_decision and
      current_recovery_outcome alongside a narrowed temporary
      current_recovery_command compatibility payload.
    - RecoveryPhase returns RecoveryApplicationResult with classification,
      RecoveryDecision, optional RecoveryOutcome, command_kind, and trace parent.
    - Immediate terminal recovery records RecoveryOutcome and clears the
      temporary current_recovery_plan.
    - Default CLI/runtime construction no longer injects BoundedRecoveryPolicy
      into RunCoordinator.
    - Task planning, planner context, local benchmark metrics, adaptive routing
      metrics, and recovery evolution diagnostics read current FailureEnvelope /
      RecoveryPlan / RecoveryHistory evidence instead of legacy incident
      diagnostics.
    - Coordinator line count, run_sync length, and RunCoordinator method count
      decreased below the SAR-8C call-site migration ratchet.
    - RecoveryDecision to RecoveryPlan/RecoveryCommand conversion is isolated
      in recovery_decision_compatibility.py; RecoveryPlan no longer enters
      StateKernel, while RecoveryCommand
      remain compatibility trace/dispatcher payloads and are no longer selected
      by the default Coordinator recovery owner.
    - RecoveryStrategySelected default RecoveryPhase trace payload now records
      canonical RecoveryDecision instead of legacy RecoveryPlan.
    - StateKernel no longer imports or stores RecoveryPlan/current_recovery_plan;
      cross-turn recovery compatibility is narrowed to the pending
      current_recovery_command plus canonical current_recovery_decision.
    - RunCoordinator.run_sync no longer reads legacy current_recovery_plan for
      pending recovery command checks; it uses canonical current_recovery_decision
      through a migration helper.
    - TaskPlanLifecycle recovery summaries no longer read legacy
      current_recovery_plan; they use canonical current_recovery_decision kind
      and re-entry phase.
    - RecoveryPhase no longer constructs RecoveryPlan through the compatibility
      adapter; it projects only the pending RecoveryCommand needed by remaining
      dispatcher/completion compatibility paths.
    - RecoveryCoordinator no longer exposes a legacy plan() API; decide() is
      the only canonical recovery selection entrypoint.
    - Task pipeline intake recovery uses RecoveryDecision plus the temporary
      command adapter instead of RecoveryCoordinator.plan().
    - RecoveryHandler keeps legacy RecoveryEvaluation compatibility by locally
      projecting a RecoveryPlan from RecoveryDecision, with unaccepted profile
      strategy artifacts filtered before canonical decision selection.
    - RecoveryPhase owns pending recovery plan-change completion; Coordinator
      no longer constructs recovery receipt/delta/history for replan-step or
      replan-task success paths inline.
    - RecoveryPhase owns pending recovery binding completion and failed pending
      command completion; Coordinator no longer owns the reground/reroute
      receipt/delta/history construction helper.
    - RecoveryPhase owns pending idempotent retry execution completion;
      Coordinator no longer constructs retry recovery receipt/delta/history
      inline after execution.
    - RecoveryPhase owns pending recovery observation completion, including
      reobserve and post-state inspection receipt/delta/history/outcome
      commits; Coordinator retains only the verifier call needed to produce an
      inspection result.
    - planner_waiting_clarification maps to internal model/context/provider
      recovery only when typed action-space facts prove available actions.
    - planner_waiting_clarification without typed action-space facts fails
      closed to unknown/abort instead of default ask_user or replan.
    - entry_outcome_already_satisfied is recognized only from typed
      proposal_rejection code/reason_code, maps to current-step progress
      precheck owner, and is not treated as replan/ask_user recovery.
    - RecoveryPhase now passes its typed action-space facts into
      classify_failure(), so phase recovery no longer drops
      available_action_count/user_input_required before strategy selection.
    - Request-only PlannerUnsupportedResponse reason_code can reach the
      Coordinator recovery FailureEnvelope through the current PlannerDecision
      compatibility seam.
    - Legacy PlannerDecision without proposal/contract/result is assigned the
      explicit legacy_decision_without_proposal failure code and fails closed to
      unknown/abort instead of being treated as planner_failed or eligible for
      default step replan.
    - RunCoordinator pending recovery checks use canonical
      current_recovery_decision.kind directly; the RecoveryKind to
      RecoveryCommandKind pending helper mapping has been deleted.
    - RunCoordinator recovery helper seams return canonical RecoveryKind for
      branch decisions; RecoveryCommandKind remains inside RecoveryPhase /
      dispatcher compatibility only.
    - RunCoordinator idempotent retry safety checks read canonical
      current_recovery_decision.idempotency_key and current_failure.effect_status
      instead of the legacy current_recovery_command payload.
    - StateKernel no longer stores current_recovery_command; RecoveryPhase
      derives the temporary legacy command from current_recovery_decision and
      current_failure only inside the compatibility adapter boundary.
    - StateKernel no longer stores legacy RecoveryReceipt or RecoveryDelta
      lists; RecoveryPhase writes command completion and delta evidence to trace
      payloads and stores only canonical current_recovery_outcome plus bounded
      recovery_history for strategy oscillation checks.
    - RecoveryCoordinator no longer imports or uses legacy recovery_commands
      vocabulary; RecoverySelectionContext normalizes available/preferred
      commands to canonical RecoveryKind and RuntimePhase, while RecoveryPhase
      remains the temporary command adapter boundary.
    - RunCoordinator and ProposalRejectionRecoveryPolicy no longer use
      RecoveryCommandKind or OWNER_DISPATCH_COMMANDS; Coordinator-facing
      recovery availability is expressed as canonical RecoveryKind and the
      legacy command vocabulary remains inside RecoveryPhase/owner-dispatch
      compatibility.
    - "RecoveryApplicationResult exposes canonical recovery_kind: RecoveryKind
      instead of legacy command_kind; RecoveryCommandKind remains an internal
      RecoveryPhase adapter detail."
  excluded:
    - RecoveryCommand / RecoveryPlan / RecoveryReceipt physical deletion from
      compatibility trace/dispatcher modules.
    - legacy RecoveryAction / RecoveryIncident / RecoveryAttempt module
      deletion from offline compatibility tests.
    - Full RecoveryCommand / RecoveryReceipt physical deletion from owner
      dispatcher and external recovery compatibility modules.
    - Planner ActionChoiceBuilder.
    - new task-family regex or deterministic fallback.
    - PR breadth, fresh diagnostic, or promotion claim.

failure_kind_policy:
  model_deferral_with_action_space:
    default_strategy_order:
      - compact_context
      - repair_model_schema
      - switch_provider
      - abort
    ask_user_default: false
    replan_default: false
    same_context_no_op_retry: false
  current_step_already_satisfied:
    owner: progress_precheck
    recovery_strategy_order:
      - abort
    normal_runtime_path: complete_step_then_continue
  missing_user_input:
    default_strategy_order:
      - ask_user
      - abort

  remaining_sar_8_work:
  - Replace RecoveryCommand/RecoveryReceipt trace/dispatcher
    compatibility payloads with RecoveryOutcome where external recovery action
    results are genuinely needed.
  - Delete RecoveryPlan from the isolated recovery_decision_compatibility
    adapter and recovery_coordinator.plan() compatibility API.
  - Delete legacy RecoveryAction/Incident/Attempt/Cascade modules and their
    dedicated compatibility tests after evolution/profile artifacts are migrated
    or archived.
  - Preserve the planner clarification distinction learned from SAR-7 fresh
    diagnostic classification.


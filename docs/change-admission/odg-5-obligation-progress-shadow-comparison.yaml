slice_id: odg-5-obligation-progress-shadow-comparison
parent_decision: docs/change-admission/odg-0-obligation-driven-progress-architecture.yaml
decision_date: 2026-07-28
base_revision: 65532962732ca3f3b4baff66af966cd1324ca23f
change_type: architecture_shadow_diagnostic_foundation
agent_mode: single_agent
production_behavior_change: false
production_writers: 1
remote_ci: disabled

single_primary_owner: Obligation progress shadow comparison diagnostics

goal: >
  Harden the authority-free diagnostic comparator between legacy TaskPlan
  progress projection and canonical obligation ready projection, then add a
  read-only runtime projection seam. This slice prepares the later
  post-observation trace hookup by producing a typed comparison, trace identity
  envelope, and legacy-verified progress projection without mutating
  StateKernel, initializing the obligation ledger, writing trace, committing
  obligation progress, changing finish authority, or altering Planner input.

included:
  - TaskPlanShadowProjection
  - ObligationProgressShadowClassification
  - ObligationProgressShadowComparison
  - ObligationProgressShadowTraceProjection
  - compare_obligation_progress_shadow()
  - trace identity envelope
  - legacy_verified_projection source marker
  - project_verified_legacy_progress()
  - prepare_obligation_progress_shadow_trace()
  - exact-id mapping from legacy subgoals to canonical obligations
  - many TaskPlan strategy steps may map to one canonical obligation
  - aligned classification
  - legacy_active_non_progress_predicate classification
  - obligation_ready_without_subgoal classification
  - subgoal_without_obligation classification
  - dependency_divergence classification
  - stale_progress diagnostic classification
  - invalid_progress diagnostic classification

excluded:
  - Coordinator trace write
  - StateKernel initialization
  - StateKernel mutation
  - Coordinator satisfaction commit
  - StateKernel.satisfy_task_obligation()
  - finish gate change
  - PlannerContext ready-obligation projection
  - TaskPlan replacement or deletion semantics
  - TaskPlanLifecycle authority change
  - Recovery behavior
  - BrowserGym adapter changes
  - benchmark rerun
  - fresh diagnostic
  - promotion claim

authority_rules:
  comparator_input_allowed:
    - TaskPlanShadowProjection
    - ReadyObligationProjection
    - satisfied obligation id snapshot
  comparator_input_forbidden:
    - StateKernel
    - Coordinator
    - TraceDag
    - BrowserGym task name
    - URL
    - selector
    - coordinate
    - benchmark family
    - Planner state
    - model-authored progress
    - receipt success
    - external reward
  runtime_projection_source: legacy_verified_projection
  exact-id mapping: true
  lexical_mapping: prohibited
  completed_without_evidence_is_satisfied: false
  initializes_obligation_ledger: false
  mutates_obligation_ledger: false
  writes_state: false
  writes_trace: false
  standard_path_authority: not_authorized
  dual_authority: false

diagnostic_classifications:
  aligned: legacy active subgoal maps to the canonical ready obligation
  legacy_active_non_progress_predicate: legacy active subgoal maps to a role-pending predicate
  obligation_ready_without_subgoal: canonical ready obligation has no legacy TaskPlan subgoal
  subgoal_without_obligation: legacy active subgoal has no canonical obligation mapping
  dependency_divergence: legacy active subgoal is not ready in the canonical graph
  stale_progress: obligation projection was stale
  invalid_progress: obligation projection input was invalid

forbidden:
  - call trace.add
  - call StateKernel.initialize_obligation_progress
  - call StateKernel obligation mutation
  - add Coordinator control flow
  - add finish authority from shadow comparison
  - alter PlannerContext
  - alter StateKernel
  - alter TaskPlanFlow
  - alter TaskPlanLifecycle
  - alter BrowserGym evidence declarations
  - call benchmarks or promote score
  - infer divergence from lexical task family names
  - map subgoals by subject text
  - map subgoals by objective text
  - map subgoals by active control
  - treat completed subgoals without verifier evidence as satisfied obligations

tests:
  focused:
    - tests/test_obligation_progress_shadow.py
    - tests/test_obligation_progress_shadow_flow.py
    - tests/test_obligation_ready_projection.py
    - tests/test_obligation_progress.py
    - tests/test_obligation_progress_ledger.py
  architecture:
    - tests/test_horizontal_architecture_governance.py
    - tests/test_r8_architecture_boundaries.py
    - tests/test_responsibility_containment.py

architecture_admission: pass
closure_status: runtime_projection_foundation_only
promotion_status: held

next_requirement: >
  Continue with ODG-5 post-observation trace hookup only after this runtime
  projection foundation passes local gates. The hookup must replace the existing
  post-observation inline block rather than add new run_sync control flow, must
  reduce the run_sync line count below 2039, and still must not commit
  obligation satisfaction, replace finish authority, initialize/mutate the
  obligation ledger, or change PlannerContext.

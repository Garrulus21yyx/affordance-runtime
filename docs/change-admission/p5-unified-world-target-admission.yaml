target_architecture:
  document: docs/superpowers/specs/2026-08-05-task-contract-centered-runtime-authoritative-architecture.md
  status: admitted_with_vertical_gates
  center: unified_world_runtime_owned_action_space_short_agent_loop

legacy_disposition:
  transactional_target: frozen
  coordinator_state_kernel_runtime_committer: retained_as_default_baseline
  expansion: prohibited_except_baseline_bug_fix
  deletion: prohibited_before_default_cutover

included:
  - strong TaskGoal and optional EvaluationSpec
  - optional TaskPlan Milestone and LocalObjective contracts
  - WorldObservation AgentWorldView ActionBinding and task-aware ActionSpace
  - ActionIntent BoundActionRequest ActionResult and independent evaluations
  - symmetric SurfaceAdapter contract
  - non-default real DOM positive vertical
  - source/world identity and fingerprint currentness closure

excluded:
  - Visual or WoT target vertical implementation
  - full human-confirmation continuation
  - ActionBatch integration
  - long-horizon TaskPlan execution
  - external full-agent benchmark
  - default product cutover
  - old transactional core deletion
  - ledger checkpoint resume event sourcing or generic recovery transaction
  - global capability approval or token registry

default_cutover_gates:
  - positive DOM Visual and WoT target-loop verticals
  - same TaskGoal policy evaluators and semantic vocabulary with adapter-only variation
  - task-aware ActionSpace and evaluator-owned completion
  - stale zero-call and SENT_UNKNOWN no-retry
  - P5-D semantic confirmation core
  - internal matrix with zero forbidden effects and duplicate unknown attempts

rollback_and_deletion:
  non_default_dom_rollback: remove target composition without changing legacy default
  legacy_deletion_condition: default cutover gates pass and legacy imports leave default call path
  evidence_scope: exact_revision_only

architecture_admission: pass
promotion_status: held

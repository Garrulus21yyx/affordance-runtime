slice_id: odg-6-1-shared-attribution-contract-hardening
parent_decision: docs/change-admission/odg-0-obligation-driven-progress-architecture.yaml
related_foundation:
  - docs/change-admission/odg-2-obligation-progress-contracts.yaml
  - docs/change-admission/odg-6-current-observation-obligation-satisfaction.yaml
decision_date: 2026-07-28
base_revision: dac2c5f1e54ca632989861c5ed561e1e53e1f739
change_type: shared_contract_hardening
agent_mode: single_agent
production_behavior_change: false
production_writers: 1
remote_ci: disabled

single_primary_owner: Shared obligation attribution identity and evidence contracts

goal: >
  Harden the shared attribution contracts before ODG-7 so current-observation
  and post-verification satisfaction preparations carry complete TaskSpec
  identity, typed source identity, and evidence strength/kind/source
  requirements without connecting any standard runtime progress authority.

included:
  - ProgressAttributionTicket.task_spec_identity
  - ObligationSatisfactionPreparation.task_spec_identity
  - CurrentObservationSatisfactionSource
  - PostVerificationSatisfactionSource
  - CurrentObservationAffordanceFact.evidence_kind
  - CurrentObservationAffordanceFact.strength
  - CurrentObservationAffordanceFact.source_ref
  - CurrentObservationSatisfactionResult
  - weak evidence rejection
  - typed evidence kind/source compatibility checks
  - multiple independent current-observation satisfactions
  - ambiguous target classification
  - stale observation identity classification

excluded:
  - ODG-7 ticket resolver
  - AttributionActionView
  - Coordinator satisfaction commit
  - StateKernel.satisfy_task_obligation()
  - StateKernel obligation ledger initialization or mutation
  - finish gate change
  - PlannerContext ready-obligation projection
  - Planner input or PlannerPort signature change
  - TaskPlan replacement or deletion semantics
  - TaskPlanLifecycle authority change
  - post-action attribution
  - BrowserGym adapter changes
  - benchmark rerun
  - fresh diagnostic
  - promotion claim

authority_rules:
  synthetic_contract_id_for_current_observation: prohibited
  task_spec_identity_required:
    - ProgressAttributionTicket
    - ObligationSatisfactionPreparation
  satisfaction_source:
    current_observation: CurrentObservationSatisfactionSource
    post_verification: PostVerificationSatisfactionSource
  current_observation_evidence:
    minimum_strength: independent
    kind_must_match_typed_requirement: true
    source_ref_must_match_source_constraints: true
  writes_state: false
  writes_trace: false
  mutates_obligation_ledger: false
  changes_planner_input: false
  changes_finish_gate: false
  standard_path_authority: not_authorized
  dual_authority: false

tests:
  red_green:
    - tests/test_obligation_progress.py
    - tests/test_current_observation_obligation_satisfaction.py
  focused:
    - tests/test_obligation_progress.py
    - tests/test_current_observation_obligation_satisfaction.py
    - tests/test_obligation_ready_projection.py
    - tests/test_obligation_progress_ledger.py
  architecture:
    - tests/test_horizontal_architecture_governance.py
    - tests/test_r8_architecture_boundaries.py
    - tests/test_responsibility_containment.py

architecture_admission: pass
closure_status: shared_contract_hardening
promotion_status: held

next_requirement: >
  Enter ODG-7 attribution action view and candidate ticket resolver as a
  separate foundation-only slice. ODG-7 must not save tickets through
  Coordinator, modify ActionContract schema, pass tickets to Executor or
  Verifier, mutate the obligation ledger, change finish authority, change
  PlannerContext, run PR breadth, or claim promotion.

scope:
  current_record: plan_and_architecture_update_only
  selected_next_sequence:
    - FOR-1 FailureOwner vocabulary and single ownership router.
    - FOR-2 Runtime RecoveryPhase narrowing and semantic RecoveryKind deletion.
    - FOR-3 structured STEP_PLANNER / TASK_PLANNER / USER / PROGRESS handoff.
    - FOR-4 duplicate routing deletion and behavioral classification gate.
  included:
    - Keep FailureEnvelope as the single failure model.
    - Replace FailureDisposition with six-way FailureOwner.
    - Make classify_failure the single Failure Ownership Router.
    - Route only RUNTIME_RECOVERY failures into RecoveryPhase.
    - Keep STEP_PLANNER limited to choice_id selection with PlannerFailureContext.
    - Route TASK_PLANNER through TaskPlan revision and TaskPlanAuthority only.
    - Route USER only for true user-owned information, approval, credential, or irreversible decisions.
    - Route unknown, unsafe, denied, exhausted, and invariant-broken failures to TERMINAL.
  excluded:
    - New failure model.
    - New recovery state machine.
    - RecoveryCascade or any history/attempt/receipt/delta object system.
    - Reintroducing RecoveryPlan / RecoveryCommand.
    - Planner free action generation.
    - Planner-authored target, parameters, expected effects, evidence requirements, finish, or backend.
    - TaskPlan changes outside TaskPlanAuthority.
    - Progress or finish authority changes in this documentation-only record.

owner_routing:
  PROGRESS:
    - current criterion already satisfied.
    - action effect observed but step not committed.
    - step complete or all steps complete before task completion verification.
  RUNTIME_RECOVERY:
    - stale snapshot/page/locator.
    - reground or rebind same semantic target.
    - temporarily missing evidence source.
    - uncertain side effect needing verification before retry.
    - provider timeout or model schema repair.
    - idempotent retry, backend switch, checkpoint restore, session restart, or compensation.
  STEP_PLANNER:
    - effect proven absent and current step still has alternatives.
    - field validation or business-rule rejection within the same active step.
  TASK_PLANNER:
    - active step impossible.
    - plan assumption invalid.
    - dependency or step structure invalid.
  USER:
    - missing user-known value.
    - genuine semantic ambiguity.
    - approval, credential, or trusted authorization required.
    - irreversible user decision.
  TERMINAL:
    - policy denied.
    - unsafe action.
    - budget exhausted.
    - unrecoverable environment.
    - unknown classification.
    - invariant broken.

hard_gates:
  failure_routing:
    failure_contract_count: 1
    owner_router_count: 1
    owner_enum_count: 1
    full_history_in_statekernel: false
  runtime_recovery:

slice_id: tpa-3-3-generalist-request-only-core
parent_decision: tpa-0-taskplan-authority-freeze
base_revision: a7c3668d46d93843a2f38d6fe5004add8f0fed65
change_type: planner_input_boundary_migration
production_behavior_change: false
production_writers: 1

single_primary_owner:
  GeneralistLMPlanner: internal immutable PlanningRequest core

included:
  - GeneralistLMPlanner builds PlanningRequest once at propose entry
  - GeneralistLMPlanner builds provider PlannerContext from PlanningRequest
  - strict terminal admission is applied from immutable PlannerAdmissionView
  - terminal readiness diagnostic payload is preserved from admission summary
  - PlanningRequest preserves bounded list-like affordance state through frozen values
  - legacy active-step objective/action-family are carried as immutable compatibility context when no canonical step projection exists
  - no-canonical-obligation legacy TaskSpecs project as no-plan rather than invalid step authority

excluded:
  - PlannerPort public signature cutover
  - Coordinator call site change
  - legacy build_context compatibility function deletion
  - legacy narrow_terminal_candidates deletion
  - TaskPlanAuthority production cutover
  - active-step progress authority cutover
  - finish-authority change
  - ODG-9 / ODG-10 / ODG-11
  - PR breadth claim
  - promotion

authority:
  plan_generation: unchanged
  plan_decision: unchanged
  plan_commit: RunCoordinator
  plan_storage: StateKernel
  progress_authority: legacy_taskplan_subgoal_planprogress
  planner_input_authority: PlanningRequest projection
  context_serialization_owner: PlannerContextBuilder
  state_writer: unchanged
  trace_writer: unchanged

required_invariants:
  - GeneralistLMPlanner.propose must not call PlannerContextBuilder with legacy state/snapshot arguments after request construction
  - GeneralistLMPlanner.propose must not call narrow_terminal_candidates
  - request-based provider context must preserve existing bounded affordance state semantics
  - compatibility active-step text is immutable context only, not canonical Step authority
  - no canonical obligation graph must not create a fake active StepSpec
  - strict terminal admission diagnostics remain available in planner_context
  - PlannerPort, Coordinator, StateKernel, TaskPlan admission, progress authority, and finish authority remain unchanged

tests:
  focused:
    - tests/test_generalist_planner.py
    - tests/test_planner_context.py
    - tests/test_planning_request_builder.py
    - tests/test_simplified_step_projection.py
    - tests/test_decision_constraints.py
  architecture:
    - tests/test_horizontal_architecture_governance.py
  full_local_gate:
    - python -m pytest -q
    - python -m ruff check src tests scripts
    - python -m mypy --ignore-missing-imports src
    - uv build
    - git diff --check

runtime_effect:
  planner_behavior_changed: false
  standard_planner_signature_changed: false
  coordinator_changed: false
  statekernel_changed: false
  taskplan_authority_changed: false
  browsergym_changed: false

closure_status: generalist_request_only_core_foundation
next_slice: tpa-3-4-parent-agent-planner-request-migration
promotion_status: held

  executable_red: tests/test_task_planning.py::test_validator_repairs_current_submit_button_availability_after_text_progress

problem_statement: >
  `enter-text:seed-1` completed the text-change subgoal, then Runtime kept an
  independent read-only `submit_button is available` subgoal active. The current
  observation already contained a visible/enabled Submit button, but TaskPlan
  current-entry state matching did not treat `submit_button` as matching the
  `Submit` button role/label, so the plan remained incomplete and the
  Coordinator finish guard correctly rejected finish.

allowed_writes:
  - src/affordance_runtime/task_planning.py
  - tests/test_task_planning.py
  - docs/change-admission/v-prb-6b-read-only-availability-cardinality.yaml
  - docs/change-admission/v-prb-6b-single-subgoal-terminal-completion.yaml
  - docs/current-implementation-plan.md
  - docs/implementation-status.md
  - .codex/goal-plan.md

forbidden_changes:
  - Coordinator finish guard weakening
  - BrowserGym official reward as Runtime completion authority
  - ExecutionReceipt.success based subgoal completion
  - external evaluator based subgoal completion
  - Prompt, model-call budget, retry budget, timeout, or cost changes
  - task-name, URL, selector, coordinate, or benchmark-family branches
  - immutable Planner input / PlannerStateView migration
  - StateKernel mutation ownership changes
  - V-PRB-6A progress-scope binding changes


single_primary_owner: canonical obligation compiler boundary
mechanism: provider graph proposal normalization

source_evidence:
  clean_rerun: docs/evidence/runs/m8.2a-pr-breadth-9b951ed/
  affected_episodes:
    - click-button-sequence:seed-0
    - click-button-sequence:seed-1
    - form-sequence:seed-0
    - form-sequence:seed-1
  observed_failure:
    root_layer: INTENT / PLANNING
    status: intent_compilation_rejected
    issue_codes:
      - invalid_task_obligation_graph
      - invalid_provider_obligation
  root_cause:
    Provider drafts supplied source-bound requested_effects and sometimes
    proposal claims for multi-stage tasks, but did not supply a complete legal
    obligation graph. The current Runtime only canonicalizes requested_effects
    for TaskStructure.FLAT, so multi-stage drafts can incorrectly make provider
    graph completeness a READY prerequisite.

owner_before:
  - LLM provider proposal graph
  - intent draft repair loop

owner_after:
  - CanonicalObligationCompiler.compile_requested_effects
  - LLMIntentCompiler draft normalization

non_goals:
  - do not modify Coordinator
  - do not modify StateKernel
  - do not modify PlannerPort
  - do not add PlannerStateView
  - do not modify prompt
  - do not modify model-call, retry, timeout, or cost budget
  - do not add task-name, URL, selector, coordinate, or benchmark-family branches
  - do not change BrowserGym adapter behavior
  - do not run fresh diagnostic, PR/nightly/release, or claim an official score

architecture_boundaries:
  state_writer: unchanged
  trace_writer: unchanged
  benchmark_specific_logic_added: false
  provider_graph_authority: false
  runtime_graph_authority: true
  compatibility_waiver: none

non_browsergym_red_tests:
  - tests/test_intent_compiler.py::test_llm_compiler_canonicalizes_multistage_requested_effects_when_provider_graph_is_incomplete

tests_required:
  - non-BrowserGym red/green test for incomplete provider graph with multi-stage requested_effects
  - existing canonical obligation compiler tests
  - intent compiler tests
  - task obligation coverage tests
  - horizontal architecture governance gates
  - rerun PR breadth 6-task x 2-seed matrix after commit

expected_repair_shape:
  - preserve valid provider proposal graph normalization when present
  - when provider graph is incomplete but requested_effects are source-bound,
    generate Runtime-owned canonical claims and obligations from requested_effects
  - never copy provider graph ids into TaskSpec
  - fail closed if requested_effects reference unknown source units
  - fail closed if deterministic coverage rejects the generated graph


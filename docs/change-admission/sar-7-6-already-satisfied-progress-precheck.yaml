purpose:
  - Close the clear SAR-7 fresh diagnostic residual in which an already
    satisfied current step was treated as TaskPlan validation/replan failure.
  - Keep already-satisfied step handling under the current-state progress
    precheck owner before SAR-8 recovery protocol unification.

included:
  - TaskPlanFlow accepts validation reports whose only issue is
    entry_outcome_already_satisfied so the plan can be installed and checked
    by the existing progress precheck.
  - RunCoordinator invokes the existing current-state completion seam
    immediately after accepting and activating a TaskPlan.
  - Regression coverage that the already-satisfied initial active step is
    completed before reaching Planner and without recovery.

excluded:
  - SAR-8 recovery protocol unification
  - new Planner fallback rules
  - task-family, URL, selector, or lexical repair branches
  - TaskPlan deletion or replacement semantics
  - TaskProgress data-model replacement
  - finish-authority changes
  - benchmark promotion claims


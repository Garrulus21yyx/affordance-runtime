    run_sync_loc_max: 180
    RunCoordinator_methods_max: 2
  stage:
    top_level_stage_count: 5
    stage_to_stage_import_edges: 0
    stage_run_call_parameters_max: one_input_object
    stage_direct_state_mutations: 0
    stage_direct_trace_writes: 0
    mutable_runtime_writers: 1
  complexity:
    orchestration_cluster_loc_reduction_from_baseline: at_least_25_percent
    orchestration_cluster_loc_max_from_5716_baseline: 4287
    coordinator_direct_dependency_count_max: 7
    new_stage_modules_after_freeze: 0
    compatibility_adapter_count_default_path: 0
  canonical_model:
    default_planner_output: PlannerResponse
    PlannerDecision_default_imports: 0
    reflective_planner_dispatch: 0
    default_progress_shadow: 0
    non_runtime_RecoveryDecision: 0
  state:
    StateKernel_full_history_collections: 0
    StateKernel_compatibility_aliases: 0
    history_source_of_truth:
      - Trace
      - ArtifactStore
  behavioral_gate: required

validation_strategy:
  development_commit:
    - focused_tests
    - relevant_architecture_gates
    - ruff_changed_files
    - git_diff_check
  completed_replacement_unit_C1_through_C8:
    - subsystem_tests
    - adjacent_integration_tests
    - core_mypy
    - ruff
    - deletion_gates
    - full_pytest_after_real_production_cutover_and_physical_old_module_deletion
  documentation_only_commit:
    full_suite_repeat: not_required
  C9_final_closure:
    - full_pytest
    - full_ruff
    - core_mypy
    - uv_build
    - dependency_and_import_graph_gate
    - orchestration_loc_gate
    - clean_6_by_2_pr_breadth
    - fresh_diagnostic
  promotion_rule: promotion_remains_held_until_every_final_exit_gate_passes

prohibitions:
  - add_more_top_level_phases
  - add_stage_facade_while_retaining_old_phases
  - add_a_second_StageResult
  - add_compatibility_adapter
  - allow_phase_to_write_State_or_Trace
  - reduce_Coordinator_LOC_without_reducing_orchestration_cluster_LOC
  - move_old_code_to_compatibility_while_default_path_calls_it
  - substitute_yaml_or_forbidden_token_tests_for_physical_deletion

final_decision:
  approved:
    - recovery_protocol_simplification
    - ActionChoice_planner_authority_reduction
    - FailureOwner_direction
    - ActionOutcome_boundary
    - Coordinator_topology_decomposition
  not_yet_approved_as_complete:
    - SAR_9_full_architecture_closure
    - phase_purity
    - StateKernel_slimming
    - compatibility_retirement
    - public_API_stabilization
    - total_core_slimming
  final_exit:
    top_level_stages: 5
    mutable_writers: 1
    default_compatibility_adapters: 0
    statekernel_history_collections: 0
    orchestration_cluster_loc_reduction: at_least_25_percent
    behavioral_gate: required
  one_sentence_closure: >-
    The giant Coordinator is decomposed and several parallel authorities are gone,
    but SAR-9 closes only after five stable stages share one result protocol, a
    single RuntimeCommitter owns State and Trace writes, old phases and default
    compatibility are physically deleted in the same replacement units, and both
    StateKernel and total orchestration code materially shrink.

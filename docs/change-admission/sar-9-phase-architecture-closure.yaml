unified_stage_protocol:
  generic_result: StageResult[T]
  immutable: true
  fields:
    output: T_or_none
    transition: RuntimeTransition_or_none
    events: tuple_of_RuntimeEvent
    failure: FailureEnvelope_or_none
    terminal: TerminalResult_or_none
    directive: LoopDirective
  directives:
    - CONTINUE
    - REPEAT_OBSERVATION
    - NEXT_STAGE
    - WAIT_USER
    - TERMINAL
  invocation: stage.run(StageInput)
  maximum_run_parameters: one_input_object
  coordinator_private_control_fields_forbidden:
    - parent
    - continue_observing
    - contract_missing
    - completion_committed
    - current_state_completion_committed
    - skill_complete
    - recovery_kind


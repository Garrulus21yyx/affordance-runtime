slice_id: v-prb-3-typed-semantic-action-constraints
packet_role: child_production_slice
parent_packet: docs/change-admission/v-pr-breadth-intent-planning-repair.yaml
base_revision: 98c33b40666085750965e8353b27de947a28a0d7
change_type: vertical_generic_correctness_repair
production_change_allowed: true

single_responsibility: >
  Resolve empty strict-planner clarification into one current typed semantic
  action when TaskSpec fields and current affordance summaries identify a
  unique safe target/value.

single_primary_owner: strict semantic action resolver

owner_before:
  - GeneralistLMPlanner preserved empty model ask_user proposals even when the
    current TaskSpec and affordance inventory already contained one safe
    activation, selection terminal, or text-entry action.

owner_after:
  - StrictSemanticActionResolver owns the typed, stateless action decision.
  - GeneralistLMPlanner only invokes the resolver after the model asks an empty
    clarification.
  - Coordinator remains the only task-execution commit sequencer.

target_episodes:
  - choose-list:seed-0
  - choose-list:seed-1
  - click-button:seed-0
  - click-dialog:seed-0
  - click-dialog:seed-1
  - enter-text:seed-0
  - enter-text:seed-1

non_goals:
  - do not modify Coordinator
  - do not modify StateKernel
  - do not modify PlannerPort
  - do not add PlannerStateView
  - do not modify Prompt
  - do not adjust model-call budgets, retries, timeouts, or costs
  - do not add task-name, URL, selector, coordinate, or benchmark-family branches
  - do not repair provider graph proposal normalization
  - do not repair structured response decoding
  - do not claim PR breadth, nightly, release, or official benchmark score

non_browsergym_red_tests:
  - tests/test_generalist_planner.py::test_strict_planner_resolves_empty_clarification_to_unique_requested_button
  - tests/test_generalist_planner.py::test_strict_planner_resolves_empty_clarification_to_selected_option_submit
  - tests/test_generalist_planner.py::test_strict_planner_resolves_empty_clarification_to_target_derived_text_value

typed_contract:
  input:
    - immutable PlannerContext
    - PlannerProposal with action_kind ask_user and empty reason
  output:
    - SemanticActionResolution
    - null when the current action is ambiguous
  forbidden_input:
    - StateKernel
    - Coordinator
    - TraceDag
    - BrowserGym task name
    - URL
    - selector
    - coordinate

accepted_mechanisms:
  - unique requested visible activation label
  - already selected requested option followed by unique terminal submit-like control
  - target-derived text value with a unique enabled text entry control

acceptance_tests:
  - non-BrowserGym red tests turn green
  - full generalist planner suite passes
  - horizontal architecture governance gates pass
  - Ruff passes
  - mypy passes
  - git diff check passes

architecture_admission:
  state_writer_changed: false
  trace_writer_changed: false
  coordinator_touched: false
  statekernel_touched: false
  planner_port_touched: false
  benchmark_dependency_added: false
  planner_task_grammar_added: false
  prompt_or_budget_changed: false
  waiver: none

result:
  status: implemented_locally
  production_change_admitted: true
  producer_id: strict-semantic-action-resolver
  promotion_status: held
  rerun_required:
    - PR breadth 6-task x 2-seed matrix on a clean committed revision

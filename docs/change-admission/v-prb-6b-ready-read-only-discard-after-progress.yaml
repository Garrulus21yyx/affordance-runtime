slice_id: v-prb-6b-ready-read-only-discard-after-progress
parent_packet: docs/change-admission/v-prb-6b-has-changed-text-progress-binding.yaml
packet_role: child_production_slice

base_revision: 3942c044886df39a6c253de808c2594b8a6025d4
change_type: vertical_repair
agent_mode: single_agent
production_change_allowed: true

single_primary_owner: TaskPlanFlow ready current-state discard replacement
owner_before:
  - TaskPlanFlow could discard an active current-state satisfied read-only subgoal
  - TaskPlanFlow could not discard the same ready subgoal when active projection was empty after verified prior progress
  - Runtime therefore routed the replacement through model repair and repeated entry_outcome_already_satisfied
owner_after:
  - TaskPlanFlow may use the replacement decision subgoal when active projection is empty
  - the replacement subgoal must be ready, unfinished, not failed, dependency-complete, and read-only current-state completable
  - RunCoordinator still uses the existing TaskReplanned / StateKernel.replace_task_plan commit path

source_evidence:
  clean_rerun: docs/evidence/runs/m8.2a-pr-breadth-c382592/
  local_trace: /tmp/affordance-pr-breadth-c382592-20260728-125238/artifacts/runs/browsergym-generalist-enter-text-seed-1/events.jsonl
  trace_fact: >
    After the text action and submit action, the trace records the text-change
    subgoal as completed and active_subgoal_id as empty, but repeated
    TaskReplanRejected events reject a ready `submit_button is available`
    replacement as repairable entry_outcome_already_satisfied.
  executable_red: tests/test_task_plan_flow.py::test_flow_discards_ready_current_state_satisfied_read_only_subgoal_when_active_projection_empty

problem_statement: >
  The previous V-PRB-6B current-state discard repair handled the case where the
  satisfied read-only availability/visibility unit was currently active. The
  c382592 trace exposes a narrower follow-up: verified prior progress clears
  the active projection, but a ready dependent read-only unit remains and is
  already current-state satisfied. TaskPlanFlow should prepare the same bounded
  replacement-plan convergence instead of repeatedly asking the model to repair
  an already satisfied entry outcome.

allowed_writes:
  - src/affordance_runtime/task_plan_flow.py
  - tests/test_task_plan_flow.py
  - docs/change-admission/v-prb-6b-ready-read-only-discard-after-progress.yaml
  - docs/current-implementation-plan.md
  - docs/implementation-status.md
  - .codex/goal-plan.md

forbidden_changes:
  - Coordinator finish guard weakening
  - new RunCoordinator responsibility or growth
  - BrowserGym official reward as Runtime completion authority
  - ExecutionReceipt.success based subgoal completion
  - external evaluator based subgoal completion
  - Prompt, model-call budget, retry budget, timeout, or cost changes
  - task-name, URL, selector, coordinate, or benchmark-family branches
  - immutable Planner input / PlannerStateView migration
  - StateKernel mutation ownership changes
  - V-PRB-6A progress-scope binding changes
  - click-button JSON-invalid/schema robustness changes

typed_boundary:
  input:
    - TaskPlanReplacementDecision(active_subgoal_outcome_already_satisfied)
    - StateKernel PlanProgress completed/failed/active ids
    - immutable previous TaskPlan subgoals
  output:
    - accepted TaskPlanFlow replacement transition via existing commit path

verification:
  red:
    command: >
      python -m pytest -q
      tests/test_task_plan_flow.py::test_flow_discards_ready_current_state_satisfied_read_only_subgoal_when_active_projection_empty
    result: failed with TaskPlanFlowResult.accepted false and entry_outcome_already_satisfied
  green:
    command: >
      python -m pytest -q
      tests/test_task_plan_flow.py::test_flow_discards_ready_current_state_satisfied_read_only_subgoal_when_active_projection_empty
    result: 1 passed
  adjacent_regression:
    command: >
      python -m pytest -q tests/test_task_plan_flow.py
      tests/test_task_plan_lifecycle.py::test_replacement_without_unfinished_work_is_repairable
      tests/test_task_planning.py::test_validator_repairs_current_submit_button_availability_after_text_progress
    result: 11 passed

implementation_result:
  status: partial_positive_matrix_negative
  production_change: >
    TaskPlanFlow now resolves the already-current read-only discard target from
    the replacement decision when the active projection is empty, provided the
    candidate subgoal is ready and unfinished.
  unchanged_boundaries:
    - RunCoordinator finish guard and line/method ratchets
    - StateKernel mutation ownership
    - PlannerPort / PlannerStateView
    - Prompt, budget, retry, timeout, and provider settings
    - BrowserGym official reward remains separate from Runtime completion authority
  clean_pr_breadth_rerun:
    revision: 66dae07eb6de259a17c8f9604e30189a74fcc357
    evidence: docs/evidence/runs/m8.2a-pr-breadth-66dae07/
    result: negative; 12 expected, 12 observed, 12 official reward passed, 0 official reward failed, 3 Runtime failures
    impact: >
      The repair is partially positive because the prior click-button JSON
      invalid/schema-provider cluster no longer reproduces and external reward
      breadth reaches 12/12. It is insufficient for PR breadth acceptance:
      `enter-text:seed-1` now fails as obligation_subgoal_missing, while both
      form-sequence seeds remain the separate V-PRB-6A finish-guard
      progress-scope cluster.

architecture_admission: pass
promotion_status: held
remote_ci: disabled

done_when:
  - executable RED turns green
  - active-empty replacement convergence is covered by a non-BrowserGym test
  - ordinary replacement-without-unfinished-work negative control remains repairable
  - Coordinator growth ratchets remain green
  - no promotion, fresh diagnostic, or official score claim is made
  - clean committed PR breadth rerun classifies matrix impact before any closure claim

  red_to_green:
    - tests/test_task_plan_flow.py::test_flow_discards_current_state_satisfied_read_only_subgoal_without_replanning
  negative_control:
    - tests/test_task_plan_lifecycle.py::test_replacement_without_unfinished_work_is_repairable
  focused_regression:

  owner_confirmed: TaskPlanFlow current-state discard replacement
  production_change: >
    TaskPlanFlow now prepares an accepted replacement plan that removes an
    active already-current read-only `is_available` / `is_visible` subgoal
    while preserving verified prior subgoals. TaskPlanValidator allows this
    replacement only when the previous unfinished subgoal is the current-state
    satisfied entry; ordinary replacement-without-unfinished-work remains
    repairable.
  unchanged_boundaries:

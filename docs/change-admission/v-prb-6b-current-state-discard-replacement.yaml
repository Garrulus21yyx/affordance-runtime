slice_id: v-prb-6b-current-state-discard-replacement
parent_packet: docs/change-admission/v-prb-6b-read-only-availability-cardinality.yaml
packet_role: child_production_slice

base_revision: 428580b1cb3cd6b9b300ec47c34a16541c059f2a
change_type: vertical_repair
agent_mode: single_agent
production_change_allowed: true

single_primary_owner: TaskPlanFlow current-state discard replacement
owner_before:
  - TaskPlanFlow routed already-current read-only availability through model replan
  - TaskPlanValidator marked replacement-without-unfinished-work repairable even when the missing unfinished unit was already current-state satisfied
owner_after:
  - TaskPlanFlow prepares an accepted replacement that preserves verified subgoals and discards the already-current read-only availability subgoal
  - TaskPlanValidator permits that replacement only when the previous unfinished entry is proven already current-state satisfied
  - RunCoordinator uses the existing TaskReplanned / StateKernel.replace_task_plan commit path

source_evidence:
  clean_rerun: docs/evidence/runs/m8.2a-pr-breadth-17f2e50/
  parent_repair: docs/change-admission/v-prb-6b-read-only-availability-cardinality.yaml
  failing_runtime_cluster: enter-text:seed-1 task_planning repairable entry_outcome_already_satisfied loop
  executable_red: tests/test_task_plan_flow.py::test_flow_discards_current_state_satisfied_read_only_subgoal_without_replanning

problem_statement: >
  The first V-PRB-6B repair correctly recognized the active read-only
  `submit_button is available` subgoal as already current-state satisfied, but
  it only surfaced a repairable validation issue. Runtime then repeatedly asked
  the model to replan and exhausted repair budget. For read-only availability
  or visibility subgoals that are already current-state satisfied, the bounded
  flow should preserve verified progress and discard that serial precondition
  subgoal through the existing replacement-plan commit path.

allowed_writes:
  - src/affordance_runtime/task_plan_flow.py
  - src/affordance_runtime/task_planning.py
  - tests/test_task_plan_flow.py
  - docs/change-admission/v-prb-6b-current-state-discard-replacement.yaml
  - docs/current-implementation-plan.md
  - docs/implementation-status.md
  - .codex/goal-plan.md

forbidden_changes:
  - Coordinator finish guard weakening
  - new RunCoordinator responsibility or growth
  - BrowserGym official reward as Runtime completion authority
  - ExecutionReceipt.success based subgoal completion
  - external evaluator based subgoal completion
  - Prompt, model-call budget, retry budget, timeout, or cost changes
  - task-name, URL, selector, coordinate, or benchmark-family branches
  - immutable Planner input / PlannerStateView migration
  - StateKernel mutation ownership changes
  - V-PRB-6A progress-scope binding changes
  - click-button JSON-invalid/schema robustness changes

typed_boundary:
  input:
    - TaskPlanFlowResult
    - TaskPlanReplacementDecision(active_subgoal_outcome_already_satisfied)
    - TaskPlanValidationReport
  output:
    - accepted TaskPlanFlow replacement transition
    - TaskReplanned projection via existing commit path


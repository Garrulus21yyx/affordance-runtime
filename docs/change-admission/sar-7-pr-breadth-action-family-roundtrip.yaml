root_cause:
  summary: >
    SAR-3 introduced the PlanCandidate -> accepted TaskPlan authority path, but
    its compatibility binder converted StepSpec completion criteria back to
    legacy SubgoalSpec without preserving a generic executable action_family.
    Strict Generalist fallback only resolves empty model clarification when the
    active step exposes a typed action family, so text-entry and slider-entry
    first actions were not deterministically recovered despite unique current
    affordances and canonical criterion subjects.
  owner: TaskPlanAuthorityBinder compatibility projection

included:
  - infer legacy SubgoalSpec.action_family from generic StateCriterion subject and relation
  - preserve type_text for text/input/date subjects
  - preserve press_key for slider subjects
  - preserve activate for checkbox/button/submit/dialog/toggle subjects
  - preserve select_option for select/list/option subjects
  - keep read-only availability/visibility predicates action-family free
  - add RED/GREEN contract coverage for PlanCandidate -> legacy TaskPlan bind

excluded:
  - Planner prompt changes
  - model-call budget changes
  - task-name or URL branches
  - selector or coordinate branches
  - Coordinator control-flow changes
  - StateKernel schema changes
  - progress authority changes
  - finish authority changes
  - BrowserGym adapter changes


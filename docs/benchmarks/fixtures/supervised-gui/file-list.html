<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File list fixture</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 0; background: #f3f3f1; color: #20231f; }
    main { max-width: 860px; margin: 36px auto; padding: 28px; background: white; border-radius: 18px; }
    table { width: 100%; border-collapse: collapse; } th, td { padding: 13px; text-align: left; border-bottom: 1px solid #ddd; }
    button { padding: 8px 14px; }
  </style>
</head>
<body>
<main>
  <h1>Project files</h1>
  <p>Choose the most recently modified CSV file.</p>
  <table>
    <thead><tr><th>Name</th><th>Type</th><th>Modified</th><th>Action</th></tr></thead>
    <tbody>
      <tr><td>survey.csv</td><td>CSV</td><td>2026-08-25 09:10</td><td><button type="button">Choose</button></td></tr>
      <tr><td>summary.pdf</td><td>PDF</td><td>2026-08-27 18:20</td><td><button type="button">Choose</button></td></tr>
      <tr><td>results.csv</td><td>CSV</td><td>2026-08-28 07:45</td><td><button type="button">Choose</button></td></tr>
    </tbody>
  </table>
</main>
</body>
</html>

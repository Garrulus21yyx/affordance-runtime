<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map spatial fixture</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 0; background: #eef3ef; color: #1e3026; }
    main { max-width: 820px; margin: 36px auto; padding: 28px; background: white; border-radius: 18px; }
    svg { width: 100%; height: auto; background: #dfeadd; border-radius: 12px; }
    button { margin: 14px 8px 0 0; padding: 10px 16px; }
  </style>
</head>
<body>
<main>
  <h1>Park map</h1>
  <p>Choose the marker west of the lake and north of the station.</p>
  <svg viewBox="0 0 640 360" role="img" aria-label="Map with a lake, station, and three labeled markers">
    <path d="M390 80 C520 65 575 170 500 235 C430 280 350 205 370 130 Z" fill="#75acd2" aria-label="Lake"/>
    <rect x="265" y="270" width="110" height="45" rx="8" fill="#d6b36d" aria-label="Station"/>
    <g fill="#b83b3b" stroke="white" stroke-width="4">
      <circle cx="210" cy="120" r="18"/><circle cx="525" cy="120" r="18"/><circle cx="210" cy="300" r="18"/>
    </g>
    <g font-size="22" font-family="system-ui"><text x="190" y="86">A</text><text x="505" y="86">B</text><text x="190" y="340">C</text></g>
  </svg>
  <div aria-label="Marker choices">
    <button type="button">Marker A</button><button type="button">Marker B</button><button type="button">Marker C</button>
  </div>
</main>
</body>
</html>

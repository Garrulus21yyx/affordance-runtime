<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candidate comparison fixture</title>
  <style>
    body { margin: 0; font: 16px/1.45 system-ui, sans-serif; background: #f4f1ea; color: #17231d; }
    main { max-width: 980px; margin: 0 auto; padding: 42px 28px; }
    .candidates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    article { padding: 20px; border: 2px solid #c6cec8; border-radius: 18px; background: #fff; }
    article[data-selected="true"] { border-color: #176b52; box-shadow: 0 0 0 4px #cce8df; }
    .swatch { width: 100%; height: 110px; border-radius: 12px; margin-bottom: 14px; }
    article:nth-child(1) .swatch { background: #b73535; }
    article:nth-child(2) .swatch { background: #315d94; }
    article:nth-child(3) .swatch { background: #387653; }
    article:nth-child(1) button { background: #8f2929; }
    article:nth-child(2) button { background: #315d94; }
    article:nth-child(3) button { background: #2e6847; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
    dt { color: #627069; } dd { margin: 0; font-weight: 650; }
    button { width: 100%; margin-top: 12px; padding: 11px; border: 0; border-radius: 10px; color: white; background: #263e34; }
  </style>
</head>
<body>
<main>
  <h1>Compare three visible candidates</h1>
  <p>Choose one candidate after checking its color, price, and available size.</p>
  <section class="candidates" aria-label="Candidate set">
    <article aria-label="Harbor jacket" data-selected="false">
      <div class="swatch" role="img" aria-label="Fabric sample"></div>
      <h2>Harbor jacket</h2>
      <dl><dt>Price</dt><dd>$68</dd><dt>Size</dt><dd>M</dd></dl>
      <button id="choose-harbor" type="button" aria-pressed="false">Choose</button>
    </article>
    <article aria-label="Field jacket" data-selected="false">
      <div class="swatch" role="img" aria-label="Fabric sample"></div>
      <h2>Field jacket</h2>
      <dl><dt>Price</dt><dd>$72</dd><dt>Size</dt><dd>M</dd></dl>
      <button id="choose-field" type="button" aria-pressed="false">Choose</button>
    </article>
    <article aria-label="Cedar jacket" data-selected="false">
      <div class="swatch" role="img" aria-label="Fabric sample"></div>
      <h2>Cedar jacket</h2>
      <dl><dt>Price</dt><dd>$64</dd><dt>Size</dt><dd>L only</dd></dl>
      <button id="choose-cedar" type="button" aria-pressed="false">Choose</button>
    </article>
  </section>
  <p id="selection-status" aria-live="polite">Selected: none</p>
</main>
<script>
  document.querySelectorAll('article button').forEach((button) => button.addEventListener('click', () => {
    document.querySelectorAll('article').forEach((card) => {
      card.dataset.selected = 'false';
      card.querySelector('button').setAttribute('aria-pressed', 'false');
      card.querySelector('button').textContent = 'Choose';
    });
    const selected = button.closest('article');
    selected.dataset.selected = 'true';
    button.setAttribute('aria-pressed', 'true');
    button.textContent = 'Selected';
    document.querySelector('#selection-status').textContent = `Selected: ${selected.getAttribute('aria-label')}`;
  }));
</script>
</body>
</html>

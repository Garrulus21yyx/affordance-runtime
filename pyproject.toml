[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affordance-runtime"
version = "0.1.0"
description = "Planner-neutral GUI agent runtime for affordance contracts, trace, evaluation, and harness evolution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0,<7",
]

[project.scripts]
affordance-runtime = "affordance_runtime.app.cli:main"
affordance-runtime-benchmark = "affordance_runtime.benchmarks.cli:main"

[project.optional-dependencies]
web = [
  "playwright==1.61.0",
]
observability = [
  "langfuse>=4.14.4,<5",
]
pydantic-ai = [
  "pydantic-ai-slim[openai]>=2.33,<2.34",
  "pydantic-ai-harness>=0.25,<0.26",
]
visual = [
  "Pillow>=11,<13",
]
browsergym = [
  "browsergym-miniwob==0.14.3",
]
webarena-verified = [
  "browsergym-webarena @ git+https://github.com/ServiceNow/BrowserGym.git@9e779f087de9a65668b6974d11f9ce9816026e96#subdirectory=browsergym/webarena",
  "browsergym-webarena-verified @ git+https://github.com/ServiceNow/BrowserGym.git@9e779f087de9a65668b6974d11f9ce9816026e96#subdirectory=browsergym/webarena_verified",
  "nltk>=3.9,<4",
  "webarena-verified @ git+https://github.com/ServiceNow/webarena-verified.git@6473f72db5dcefc97b5725b59e734504edc28a21",
]
external-smoke = [
  "browsergym-miniwob==0.14.3",
]
dev = [
  "build>=1.2",
  "hypothesis>=6.112,<7",
  "numpy>=1.26,<3",
  "Pillow>=11,<13",
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
affordance_runtime = ["model/policy/prompts/*.yaml", "benchmarks/console/static/*.html", "benchmarks/console/static/*.css", "benchmarks/console/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

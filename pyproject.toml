[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affordance-runtime"
version = "0.1.0"
description = "Planner-neutral GUI agent runtime for affordance contracts, trace, evaluation, and harness evolution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0,<7",
]

[project.scripts]
affordance-runtime = "affordance_runtime.app.cli:main"
affordance-runtime-benchmark = "affordance_runtime.benchmarks.cli:main"

[project.optional-dependencies]
web = [
  "playwright==1.61.0",
]
pydantic-ai = [
  "pydantic-ai-slim[openai]>=2.31,<2.32",
]
visual = [
  "Pillow>=11,<13",
]
browsergym = [
  "browsergym-miniwob==0.14.3",
]
external-smoke = [
  "browsergym-miniwob==0.14.3",
]
dev = [
  "build>=1.2",
  "hypothesis>=6.112,<7",
  "numpy>=1.26,<3",
  "Pillow>=11,<13",
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
affordance_runtime = ["model/policy/prompts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

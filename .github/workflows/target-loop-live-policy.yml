name: Target-loop live model policy attestation

on:
  workflow_dispatch:
    inputs:
      run_live_policy:
        description: Run one live provider call on the internal safe real-DOM task
        required: true
        type: boolean
        default: false

jobs:
  live-model-policy:
    if: inputs.run_live_policy
    runs-on: ubuntu-latest
    environment: live-model-policy
    env:
      RUN_LIVE_MODEL_POLICY_ATTESTATION: "1"
      LLM_ACTIVE_PROFILE: mistral
      LLM_PROFILE_FALLBACK_TO_LOCAL: "false"
      LLM_DECISION_GROUNDING: format-only
      LLM_MISTRAL_BASE_URL: ${{ vars.LLM_MISTRAL_BASE_URL }}
      LLM_MISTRAL_MODEL: mistral-medium-3-5
      LLM_MISTRAL_API_KEY: ${{ secrets.LLM_MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,web,visual]'
      - run: python -m playwright install --with-deps chromium
      - name: Run one exact-profile live policy attestation
        run: >-
          python -m affordance_runtime.benchmarks.target_loop.live_policy
          --profile mistral-format-only
          --grounding format-only
          --min-policy-call-interval-s 7.5
          --output /tmp/live-model-policy/live-model-policy.json
      - uses: actions/upload-artifact@v4
        with:
          name: target-loop-live-model-policy-${{ github.sha }}
          path: /tmp/live-model-policy
          if-no-files-found: error

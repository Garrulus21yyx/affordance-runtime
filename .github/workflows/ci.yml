name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,parent]'
      - run: pytest -q
      - run: ruff check src tests
      - run: mypy src
      - run: python -m build

  chromium-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,web,parent,visual]'
      - run: playwright install --with-deps chromium
      - run: python scripts/chromium_smoke.py
      - run: python scripts/langgraph_parent_smoke.py --output evidence/parent
      - run: affordance-runtime benchmark --output evidence/benchmark --seeds 3
      - run: python scripts/generalization_smoke.py --benchmark evidence/benchmark/benchmark-report.json --output evidence/generalization

  container-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm runtime-test
      - run: docker compose run --rm benchmark
      - run: docker compose --profile wot-proof build
      - run: docker compose --profile wot-proof run --rm wot-conformance
      - if: always()
        run: docker compose --profile wot-proof down --volumes

  browsergym-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,browsergym]'
      - run: playwright install --with-deps chromium
      - run: python scripts/browsergym_bridge_smoke.py --output evidence/browsergym-bridge

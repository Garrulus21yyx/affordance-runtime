name: BrowserGym adapter conformance

on:
  push:
  pull_request:

jobs:
  browsergym-adapter-conformance:
    runs-on: ubuntu-22.04
    env:
      MINIWOB_URL: file:///tmp/miniwob-plusplus/miniwob/html/miniwob/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,external-smoke]'
      - run: python -m playwright install --with-deps chromium
      - name: Install exact MiniWoB source fixture
        run: |
          git clone https://github.com/Farama-Foundation/miniwob-plusplus.git /tmp/miniwob-plusplus
          git -C /tmp/miniwob-plusplus checkout 7fd85d71a4b60325c6585396ec4f48377d049838
      - name: Verify fixed real adapter conformance
        run: >-
          python -m pytest -q
          tests/test_browsergym_adapter_conformance.py
          tests/test_browsergym_active_capture_conformance.py
          tests/test_browsergym_dependency_inventory.py
          tests/test_browsergym_oracle_isolation.py
          tests/test_browsergym_report_privacy.py
      - name: Generate exact-head adapter attestation
        run: >-
          python -m affordance_runtime.benchmarks.external_smoke.cli
          adapter-conformance
          --manifest external-smoke-v1
          --seed 7
          --output-dir /tmp/browsergym-adapter-conformance
      - uses: actions/upload-artifact@v4
        with:
          name: browsergym-adapter-conformance-${{ github.sha }}
          path: /tmp/browsergym-adapter-conformance
          if-no-files-found: error
